<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTDE · Meus produtos</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#ea580c; --brand-50:#fff7ed; --brand-100:#ffedd5; --brand-200:#fed7aa; --brand-tint:#9a3412;
  --bg:#f5f6f8; --surface:#fff; --border:#e5e7eb; --ink:#0f172a; --ink-2:#475569; --muted:#94a3b8;
  --escuro:#0f172a; --escuro-2:#1e293b;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}

/* ── login ── */
/* Nasce escondido: quem decide mostrar é o onAuthStateChanged, depois de
   saber se há sessão. Visível por padrão, ele piscava dentro do iframe do
   painel da equipe a cada abertura da aba Produtos — e piscava cortado,
   porque 100vh dentro de um iframe menor não cabe. */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
#login.ver{display:flex}
/* Enquanto o Firebase não responde, nem login nem tela: só este aviso. */
#abrindo{display:flex;align-items:center;justify-content:center;
  padding:48px 24px;color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
#abrindo.sumiu{display:none}
.caixa{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:34px 32px;width:100%;max-width:380px;box-shadow:0 10px 40px -20px rgba(15,23,42,.3)}
.logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;margin-bottom:18px}
.finput{border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-size:14px;width:100%;background:#fff;color:var(--ink)}
.finput:focus{outline:2px solid var(--brand-200);border-color:var(--brand)}
.rot{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
.btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-weight:700;font-size:14px;width:100%}
.btn:disabled{opacity:.6}
.btnsm{background:#f1f5f9;color:var(--ink-2);border:none;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:500}
.btnsm.on{background:var(--brand-50);color:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--brand-200)}
.erro{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:12px;display:none}
.erro.ver{display:block}

/* ── esqueleto ── */
#app{display:none;min-height:100vh}
#app.ver{display:flex}
aside{width:210px;background:var(--escuro);display:flex;flex-direction:column;padding:18px 10px;flex-shrink:0;min-height:100vh}
.nav{background:transparent;color:#94a3b8;border:none;border-radius:9px;padding:10px 12px;text-align:left;font-size:13px;display:block;width:100%;font-weight:500}
.nav.on{background:linear-gradient(90deg,rgba(234,88,12,.18) 0%,rgba(30,41,59,.5) 100%);color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
.principal{flex:1;display:flex;flex-direction:column;min-width:0}
.topo{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.corpo{padding:22px 26px;flex:1}
.card{background:var(--surface);border-radius:14px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.selo{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block}
.falta{border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;white-space:nowrap;display:inline-block;background:#f8fafc;color:var(--muted);border:1px dashed #cbd5e1}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:#64748b;border-bottom:1px solid #e2e8f0}
td{padding:12px 16px;border-bottom:1px solid #f8fafc;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:#fcfcfd}
.lin{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #f1f5f9;font-size:13px}
.lin b{font-weight:600}

/* ── miniaturas de foto/vídeo hospedadas no Drive ── */
.midias{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:12px}
.midia{position:relative;display:block;aspect-ratio:1;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#f8fafc;text-decoration:none}
.midia img{width:100%;height:100%;object-fit:cover;display:block}
.midia .cap{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:600;color:#fff;background:rgba(15,23,42,.6);padding:2px 5px;text-align:center}
.midia.midia-erro{grid-column:1/-1;aspect-ratio:auto;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;font-size:11.5px;line-height:1.45;color:var(--ink-2);background:#fffbeb;border-color:#fde68a}
.midia.midia-erro b{color:var(--brand-tint);font-weight:700}

/* ── pop-up ── */
#mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#mask.ver{display:flex}
.pop{background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.35);width:100%;max-width:470px;padding:34px 36px 26px;text-align:center}
@media (max-width:720px){
  aside{display:none}
  .corpo,.topo{padding-left:16px;padding-right:16px}
}
</style>
</head>
<body>

<div id="abrindo">Abrindo…</div>

<div id="login">
  <div class="caixa">
    <div class="logo">O</div>
    <h1 style="font-size:19px;font-weight:800;letter-spacing:-.02em">Área do cliente</h1>
    <p style="font-size:13px;color:var(--ink-2);margin:6px 0 20px">Entre para ver seus produtos e onde cada um está anunciado.</p>
    <div style="margin-bottom:12px"><span class="rot">E-mail</span><input id="email" class="finput" type="email" autocomplete="email"></div>
    <div style="margin-bottom:16px"><span class="rot">Senha</span><input id="senha" class="finput" type="password" autocomplete="current-password"></div>
    <button id="entrar" class="btn">Entrar</button>
    <div id="loginErro" class="erro"></div>
    <a href="#" id="esqueci" style="display:inline-block;margin-top:14px;font-size:12px;color:var(--brand);text-decoration:none;font-weight:600">Esqueci minha senha</a>
  </div>
</div>

<div id="app">
  <aside>
    <div style="display:flex;align-items:center;gap:9px;padding:0 6px;margin-bottom:26px">
      <div id="avatar" style="width:40px;height:40px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0">—</div>
      <div style="min-width:0">
        <p id="nomeCliente" style="color:#f1f5f9;font-weight:800;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis"></p>
        <span style="color:#334155;font-size:9.5px">Área do cliente</span>
      </div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px">
      <button class="nav on" data-aba="produtos">Meus produtos</button>
      <button class="nav" data-aba="lojas">Minhas lojas</button>
    </nav>
    <div style="margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--escuro-2)">
      <button id="sair" class="nav" style="color:#64748b">Sair</button>
    </div>
  </aside>

  <div class="principal">
    <div class="topo">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h1 id="titulo" style="font-size:16px;font-weight:800">Meus produtos</h1>
        <span id="resumo" style="background:var(--brand-50);color:var(--brand-tint);border:1px solid var(--brand-100);border-radius:999px;padding:4px 12px;font-size:12px"></span>
      </div>
      <button id="voltar" class="btnsm" style="display:none">← Voltar</button>
    </div>
    <div class="corpo" id="corpo"></div>
  </div>
</div>

<div id="mask"><div class="pop" id="popConteudo"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, getDoc, doc, setDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { urlImagemDrive, urlAbrirDrive } from "./js/drive.js?v=64e57ef6";
import { CAMPOS_DA_FICHA, faltandoNaFicha } from "./js/ficha-produto.js?v=d305bfd7";
import { calcularMargem } from "./js/taxas.js?v=b572d901";

// Mesma configuração do app da equipe. A apiKey do front é pública por
// desenho: quem decide o que este login enxerga são as regras do Firestore,
// e elas já foram testadas contra exatamente este caso.
const app = initializeApp({
  apiKey: "AIzaSyDQ1-LndQtPvZ6zkO6CAt1fD4LQkZeI95A",
  authDomain: "otdegestao.firebaseapp.com",
  projectId: "otdegestao",
  storageBucket: "otdegestao.firebasestorage.app",
  messagingSenderId: "529737654679",
  appId: "1:529737654679:web:b7aa1d86e1a23d769564d2",
});
const auth = getAuth(app), db = getFirestore(app);

// Backend das Cloud Functions. A ficha do produto é gravada por lá, e não
// direto no Firestore: a regra proíbe o cliente de escrever `mkts`, e sem esse
// campo o produto que ele cadastrar fica invisível para o especialista — que é
// justamente quem precisa dele para anunciar.
const FN_BASE = "https://us-central1-otdegestao.cloudfunctions.net";

async function salvarFicha(dados) {
  const token = await auth.currentUser.getIdToken();
  const r = await fetch(`${FN_BASE}/salvarProdutoDoCliente`, {
    method: "POST",
    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify(dados),
  });
  let resposta;
  try { resposta = await r.json(); }
  catch { throw new Error("O cadastro de produtos ainda não está disponível. Avise a OTDE."); }
  if (!r.ok) throw new Error(resposta.erro || "Não consegui salvar. Tente de novo.");
  return resposta;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const moeda = (n) => (n === null || n === undefined || n === "") ? "—"
  : "R$ " + Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// Cores por marketplace, iguais às do sistema da equipe: o cliente e a OTDE
// falando do mesmo lugar enxergam a mesma cor.
const COR = {
  "shopee":        { bg: "#fff1e9", fg: "#ee4d2d", bd: "#ffd4c2" },
  "shein":         { bg: "#1a1a1a", fg: "#ffffff", bd: "#1a1a1a" },
  "mercado livre": { bg: "#fff8e1", fg: "#b78a00", bd: "#ffe9a8" },
  "tiktok":        { bg: "#1a1a1a", fg: "#ffffff", bd: "#1a1a1a" },
};
const cor = (m) => COR[String(m || "").toLowerCase().trim()] || { bg: "#f1f5f9", fg: "#475569", bd: "#e2e8f0" };

// "na Shein", "no Mercado Livre". Português não perdoa: "Quero anunciar no
// Shein" faz a tela parecer feita às pressas — e ela fala com o cliente.
const FEMININO = new Set(["shopee", "shein", "amazon", "americanas", "netshoes"]);
const naNo = (m) => (FEMININO.has(String(m || "").toLowerCase().trim()) ? "na " : "no ") + m;

let estado = { custId: "", nome: "", produtos: [], anuncios: [], mkts: [],
  busca: "", faltaEm: "", ordem: "falta", aberto: null, souEquipe: false,
  // "cliente" = um dono, vários marketplaces. "especialista" = um marketplace,
  // vários donos. É o mesmo dado visto pelo eixo oposto, e por isso a mesma
  // página serve os dois — o que muda é o recorte, não a tela.
  modo: "cliente", mkt: "", cliente: "" };

// ?cliente= abre a área de um cliente para quem é da EQUIPE; ?embed=1 esconde
// a barra lateral, porque nesse caso a página vive dentro do app da equipe,
// que já tem a dele.
const params = new URLSearchParams(location.search);
const EMBUTIDO = params.get("embed") === "1";

// ─── entrar ───────────────────────────────────────────────────────────
$("entrar").onclick = async () => {
  const b = $("entrar"); $("loginErro").classList.remove("ver");
  b.disabled = true; b.textContent = "Entrando...";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim().toLowerCase(), $("senha").value);
  } catch (e) {
    $("loginErro").textContent = "E-mail ou senha incorretos.";
    $("loginErro").classList.add("ver");
    b.disabled = false; b.textContent = "Entrar";
  }
};
[$("email"), $("senha")].forEach((el) => el.addEventListener("keydown", (e) => { if (e.key === "Enter") $("entrar").click(); }));
$("esqueci").onclick = async (e) => {
  e.preventDefault();
  const em = $("email").value.trim().toLowerCase();
  if (!em) { $("loginErro").textContent = "Digite seu e-mail primeiro."; $("loginErro").classList.add("ver"); return; }
  try {
    await sendPasswordResetEmail(auth, em);
    $("loginErro").style.background = "#f0fdf4"; $("loginErro").style.color = "#15803d";
    $("loginErro").textContent = "Enviamos um link para " + em;
  } catch (err) { $("loginErro").textContent = "Não consegui enviar o e-mail."; }
  $("loginErro").classList.add("ver");
};
$("sair").onclick = () => signOut(auth);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    $("app").classList.remove("ver");
    $("abrindo").classList.add("sumiu");
    // Embutido no painel da equipe, um formulário de login seria um beco: quem
    // precisa entrar é o funcionário, na janela de fora, não aqui dentro.
    if (EMBUTIDO) {
      $("abrindo").textContent = "Sua sessão expirou. Recarregue a página do painel para continuar.";
      $("abrindo").classList.remove("sumiu");
      return;
    }
    $("login").classList.add("ver");
    return;
  }
  // O custId vem da CLAIM do token, não de uma consulta: é o mesmo dado que as
  // regras do Firestore usam para decidir o que este login pode ler, então não
  // há como a tela mostrar uma coisa e a regra permitir outra.
  const t = await user.getIdTokenResult();
  const pedido = params.get("cliente") || "";

  if (t.claims.papel === "cliente" && t.claims.custId) {
    estado.custId = t.claims.custId;
    estado.modo = "cliente";
    estado.souEquipe = false;
  } else if (t.claims.papel === "especialista" && t.claims.mkt) {
    estado.mkt = t.claims.mkt;
    estado.modo = "especialista";
    estado.souEquipe = false;
  } else {
    // Não é cliente: só entra se for da equipe E disser de quem quer ver.
    // Um "senão" que deixasse passar abriria a área de qualquer cliente para
    // qualquer conta logada — e as regras do Firestore, que de fato barram,
    // só devolveriam uma tela vazia sem explicar nada.
    let daEquipe = false;
    try {
      const emp = await getDoc(doc(db, "employees", user.uid));
      daEquipe = emp.exists();
    } catch (e) { daEquipe = false; }
    if (!daEquipe || !pedido) {
      const recado = daEquipe
        ? "Falta dizer de qual cliente (?cliente=...)."
        : "Esta conta não é de cliente nem de especialista.";
      // NUNCA deslogar quando embutido. A sessão do Firebase é a MESMA do
      // painel da equipe (mesma origem, mesmo app), então um signOut aqui
      // dentro derruba o funcionário do sistema inteiro — e o que ele vê é
      // um formulário de login aparecendo do nada. Uma falha de rede na
      // leitura de employees bastava para isso acontecer.
      if (EMBUTIDO) {
        $("abrindo").textContent = recado;
        $("abrindo").classList.remove("sumiu");
        $("login").classList.remove("ver");
        return;
      }
      await signOut(auth);
      $("loginErro").textContent = recado;
      $("loginErro").classList.add("ver");
      $("login").classList.add("ver");
      $("abrindo").classList.add("sumiu");
      return;
    }
    estado.custId = pedido;
    estado.modo = "cliente";
    estado.souEquipe = true;
  }
  estado.nome = estado.modo === "especialista"
    ? estado.mkt
    : (params.get("nome") || user.displayName || "");
  $("login").classList.remove("ver");
  $("abrindo").classList.add("sumiu");
  $("app").classList.add("ver");
  if (EMBUTIDO) document.querySelector("aside").style.display = "none";
  if (estado.souEquipe) marcarSessaoDaEquipe();
  $("nomeCliente").textContent = estado.nome;
  if (estado.modo === "especialista") {
    document.querySelector("aside span").textContent = "Especialista";
    document.querySelector("[data-aba=produtos]").textContent = "Fila de trabalho";
    document.querySelector("[data-aba=lojas]").textContent = "Clientes";
  }
  $("avatar").textContent = (estado.nome || "?").split(" ").slice(0, 2).map((x) => x[0] || "").join("").toUpperCase() || "?";
  await carregar();
});

// Faixa âmbar atravessando o topo: a cor não diz "estou olhando", diz "isto
// não é meu". Sem ela é fácil confundir a área do cliente com a sua e achar
// que o sistema está mostrando dado errado.
function marcarSessaoDaEquipe() {
  if (document.getElementById("faixaEquipe")) return;
  const f = document.createElement("div");
  f.id = "faixaEquipe";
  f.style.cssText = "background:#b45309;color:#fff7ed;padding:7px 20px;display:flex;align-items:center;gap:10px;font-size:12.5px;flex-wrap:wrap";
  f.innerHTML = `<span style="background:#fff;color:#b45309;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800">EQUIPE</span>
    <span>Você está vendo e editando a área de <b style="color:#fff">${esc(estado.nome || "um cliente")}</b>. O cliente não vê nada disto.</span>`;
  document.querySelector(".principal").prepend(f);
}

async function carregar() {
  $("corpo").innerHTML = `<div style="color:var(--muted);font-size:13px;padding:30px 0">Carregando seus produtos…</div>`;
  try {
    // O especialista consulta por marketplace, o cliente por dono. As duas
    // consultas são as únicas que as regras deixam passar em cada caso: filtro
    // diferente do escopo faz o Firestore recusar a consulta inteira, e é essa
    // recusa que garante que a tela nunca mostre o que a regra não deixaria.
    const porMkt = estado.modo === "especialista";
    const [ps, as] = await Promise.all([
      getDocs(porMkt
        ? query(collection(db, "products"), where("mkts", "array-contains", estado.mkt))
        : query(collection(db, "products"), where("custId", "==", estado.custId))),
      getDocs(porMkt
        ? query(collection(db, "listings"), where("mkts", "array-contains", estado.mkt))
        : query(collection(db, "listings"), where("custId", "==", estado.custId))),
    ]);
    estado.produtos = ps.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
    estado.anuncios = as.docs.map((d) => ({ id: d.id, ...d.data() }));
    // Os marketplaces em que o cliente opera vêm dos próprios produtos: a
    // equipe copia a lista do proprietário para cada produto na importação.
    // Assim esta tela nunca precisa ler a ficha do cliente, onde há dado que
    // não é para sair daqui.
    estado.mkts = estado.modo === "especialista"
      ? [estado.mkt]
      : [...new Set(estado.produtos.flatMap((p) => p.mkts || []))];
    if (!estado.mkts.length) estado.mkts = [...new Set(estado.anuncios.map((a) => a.mkt).filter(Boolean))];
    desenhar();
  } catch (e) {
    console.error(e);
    $("corpo").innerHTML = `<div class="card" style="padding:20px">Não consegui carregar seus produtos. Tente recarregar a página.</div>`;
  }
}

const anunciosDe = (p) => estado.anuncios.filter((a) => a.produtoId === p.id || (a.chave && a.chave === p.chave));
const mktsDe = (p) => [...new Set(anunciosDe(p).map((a) => a.mkt || a.storeMkt).filter(Boolean))];

// ─── telas ────────────────────────────────────────────────────────────
function desenhar() {
  $("voltar").style.display = estado.aberto ? "" : "none";
  if (estado.aberto) return telaProduto();
  if (estado.aba === "lojas") return telaLojas();
  telaLista();
}
$("voltar").onclick = () => { estado.aberto = null; desenhar(); };
document.querySelectorAll("[data-aba]").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll("[data-aba]").forEach((x) => x.classList.toggle("on", x === b));
    estado.aba = b.dataset.aba; estado.aberto = null; desenhar();
  };
});

// Dados por produto que a lista precisa. Calculados uma vez por desenho, em
// vez de dentro de cada célula: com 60 produtos e 4 marketplaces isso é a
// diferença entre a tela abrir e a tela engasgar.
function resumoDoProduto(p) {
  const meus = anunciosDe(p);
  const mkts = [...new Set(meus.map((a) => a.mkt || a.storeMkt).filter(Boolean))];
  const precos = meus.map((a) => a.preco).filter((x) => x !== null && x !== undefined);
  const comMargem = meus.filter((a) => a.margem !== null && a.margem !== undefined);
  // A melhor margem entre os anúncios, com o marketplace dela: é a informação
  // que responde "vale a pena repetir isso em outro lugar?".
  const melhor = comMargem.sort((a, b) => b.margem - a.margem)[0] || null;
  return { meus, mkts, precos, melhor, falta: estado.mkts.filter((m) => !mkts.includes(m)) };
}

function telaLista() {
  if (estado.modo === "especialista") return telaEspecialista();
  $("titulo").textContent = "Meus produtos";
  const lojas = [...new Set(estado.anuncios.map((a) => a.storeNome).filter(Boolean))];
  $("resumo").textContent = `${estado.produtos.length} produtos${lojas.length ? " · " + lojas.length + (lojas.length === 1 ? " loja" : " lojas") : ""}`;

  const info = new Map(estado.produtos.map((p) => [p.id, resumoDoProduto(p)]));

  // ── cobertura: a pergunta que traz o cliente aqui ──────────────────
  const cobertura = estado.mkts.map((m) => {
    const c = cor(m);
    const n = estado.produtos.filter((p) => info.get(p.id).mkts.includes(m)).length;
    const pct = estado.produtos.length ? Math.round((n / estado.produtos.length) * 100) : 0;
    const ativo = estado.faltaEm === m;
    return `<button data-mkt="${esc(m)}" style="text-align:left;background:${ativo ? "#f8fafc" : "#fff"};border:1px solid ${ativo ? c.bd : "var(--border)"};box-shadow:${ativo ? "inset 0 0 0 1px " + c.bd : "0 1px 2px rgba(15,23,42,.05)"};border-radius:12px;padding:12px 14px;display:block;width:100%">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px">
        <span style="font-size:12.5px;font-weight:700;color:${c.fg === "#ffffff" ? "#0f172a" : c.fg}">${esc(m)}</span>
        <span style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${n}/${estado.produtos.length}</span>
      </div>
      <div style="height:6px;border-radius:99px;background:#eef2f7;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${c.fg === "#ffffff" ? "#1a1a1a" : c.fg};border-radius:99px"></div>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:7px">${n === estado.produtos.length ? "tudo anunciado" : `faltam ${estado.produtos.length - n}`}</div>
    </button>`;
  }).join("");

  // ── quando um marketplace está zerado, isso é o assunto da tela ────
  const zerado = estado.mkts.find((m) => !estado.produtos.some((p) => info.get(p.id).mkts.includes(m)));
  const chamada = zerado ? `
    <div class="card" style="padding:15px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-left:3px solid ${cor(zerado).fg === "#ffffff" ? "#1a1a1a" : cor(zerado).fg}">
      <div>
        <div style="font-weight:700;font-size:13.5px">Nenhum produto seu está anunciado ${esc(naNo(zerado))}</div>
        <div style="font-size:12.5px;color:var(--ink-2);margin-top:2px">São ${estado.produtos.length} produtos que já vendem em outro lugar e ainda não estão lá.</div>
      </div>
      <button data-querytodos="${esc(zerado)}" class="btnsm" style="background:var(--brand);color:#fff;font-weight:700;padding:9px 16px;white-space:nowrap">Quero anunciar ${esc(naNo(zerado))}</button>
    </div>` : "";

  // ── filtro e ordem ─────────────────────────────────────────────────
  const busca = estado.busca.toLowerCase();
  let lista = estado.produtos.filter((p) => {
    if (busca && !((p.nome || "") + " " + (p.sku || "")).toLowerCase().includes(busca)) return false;
    if (estado.faltaEm && !info.get(p.id).falta.includes(estado.faltaEm)) return false;
    return true;
  });
  const ordens = {
    falta: (a, b) => info.get(b.id).falta.length - info.get(a.id).falta.length
      || (a.nome || "").localeCompare(b.nome || "", "pt-BR"),
    margem: (a, b) => (info.get(b.id).melhor?.margem ?? -1) - (info.get(a.id).melhor?.margem ?? -1),
    nome: (a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"),
  };
  lista = lista.slice().sort(ordens[estado.ordem] || ordens.nome);

  $("corpo").innerHTML = `
    ${cobertura ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px">${cobertura}</div>` : ""}
    ${chamada}
    <div style="display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <input id="busca" class="finput" style="width:250px" placeholder="Buscar por nome ou SKU…" value="${esc(estado.busca)}">
      <select id="ordem" class="finput" style="width:auto;padding-right:30px">
        <option value="falta"${estado.ordem === "falta" ? " selected" : ""}>Onde falta anunciar</option>
        <option value="margem"${estado.ordem === "margem" ? " selected" : ""}>Maior margem</option>
        <option value="nome"${estado.ordem === "nome" ? " selected" : ""}>Nome</option>
      </select>
      ${estado.faltaEm ? `<button id="limpar" class="btnsm on">Só o que falta em ${esc(estado.faltaEm)} ✕</button>` : ""}
      <button id="novoProduto" class="btn" style="width:auto;padding:9px 16px;margin-left:auto">+ Novo produto</button>
    </div>
    <div class="card" style="overflow:hidden">
      <table>
        <thead style="background:#f8fafc"><tr>
          <th style="width:38%">Produto</th>
          <th style="width:11%">SKU</th>
          <th style="width:15%">Preço</th>
          <th style="width:16%">Melhor margem</th>
          <th>Onde está anunciado</th>
        </tr></thead>
        <tbody>${lista.map((p) => linha(p, info.get(p.id))).join("") || `<tr><td colspan="5" style="color:var(--muted);padding:26px 16px">Nenhum produto encontrado.</td></tr>`}</tbody>
      </table>
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted)">Mostrando ${lista.length} de ${estado.produtos.length} produtos</div>`;

  $("busca").oninput = (e) => { estado.busca = e.target.value; const c = e.target.selectionStart; desenhar(); const b = $("busca"); b.focus(); b.setSelectionRange(c, c); };
  $("ordem").onchange = (e) => { estado.ordem = e.target.value; desenhar(); };
  const lp = $("limpar"); if (lp) lp.onclick = () => { estado.faltaEm = ""; desenhar(); };
  document.querySelectorAll("[data-mkt]").forEach((b) => {
    b.onclick = () => { estado.faltaEm = estado.faltaEm === b.dataset.mkt ? "" : b.dataset.mkt; desenhar(); };
  });
  document.querySelectorAll("[data-querytodos]").forEach((b) => {
    b.onclick = () => popup(b.dataset.querytodos, { nome: `${estado.produtos.length} produtos` });
  });
  document.querySelectorAll("[data-editar]").forEach((b) => {
    b.onclick = (ev) => { ev.stopPropagation(); abrirFicha(estado.produtos.find((p) => p.id === b.dataset.editar)); };
  });
  const novo = $("novoProduto");
  if (novo) novo.onclick = () => abrirFicha(null);
  document.querySelectorAll("[data-prod]").forEach((tr) => {
    tr.onclick = () => { estado.aberto = estado.produtos.find((p) => p.id === tr.dataset.prod); desenhar(); };
  });
}

// ─── LISTA DO ESPECIALISTA ────────────────────────────────────────────
//
// Um marketplace, muitos clientes. A pergunta aqui não é "onde eu não estou?"
// e sim "o que ainda não subi?" — então a fila de trabalho é o padrão da tela,
// e não um filtro escondido.
function telaEspecialista() {
  $("titulo").textContent = `Produtos para ${naNo(estado.mkt).replace(/^n[ao] /, "")}`;
  const info = new Map(estado.produtos.map((p) => [p.id, resumoDoProduto(p)]));
  const noAr = estado.produtos.filter((p) => info.get(p.id).mkts.includes(estado.mkt));
  const faltam = estado.produtos.length - noAr.length;
  const clientes = [...new Set(estado.produtos.map((p) => p.custNome).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  $("resumo").textContent = `${estado.produtos.length} produtos · ${clientes.length} cliente(s)`;

  const busca = estado.busca.toLowerCase();
  let lista = estado.produtos.filter((p) => {
    if (busca && !((p.nome || "") + " " + (p.sku || "") + " " + (p.custNome || "")).toLowerCase().includes(busca)) return false;
    if (estado.cliente && p.custNome !== estado.cliente) return false;
    if (estado.faltaEm === "ja" && !info.get(p.id).mkts.includes(estado.mkt)) return false;
    if (estado.faltaEm === "falta" && info.get(p.id).mkts.includes(estado.mkt)) return false;
    return true;
  });
  const ordens = {
    falta: (a, b) => (info.get(a.id).mkts.includes(estado.mkt) ? 1 : 0) - (info.get(b.id).mkts.includes(estado.mkt) ? 1 : 0)
      || (a.custNome || "").localeCompare(b.custNome || "", "pt-BR")
      || (a.nome || "").localeCompare(b.nome || "", "pt-BR"),
    margem: (a, b) => (info.get(b.id).melhor?.margem ?? -1) - (info.get(a.id).melhor?.margem ?? -1),
    nome: (a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"),
  };
  lista = lista.slice().sort(ordens[estado.ordem] || ordens.falta);

  const c = cor(estado.mkt);
  const cartao = (chave, n, rot, destaque) => `
    <button data-fila="${chave}" style="text-align:left;background:${estado.faltaEm === chave ? "#f8fafc" : "#fff"};border:1px solid ${estado.faltaEm === chave ? (destaque || "var(--border)") : "var(--border)"};box-shadow:${estado.faltaEm === chave ? "inset 0 0 0 1px " + (destaque || "#e5e7eb") : "0 1px 2px rgba(15,23,42,.05)"};border-radius:12px;padding:13px 16px;display:block;width:100%">
      <div style="font-size:24px;font-weight:700;line-height:1.1;color:${destaque || "var(--ink)"};font-variant-numeric:tabular-nums">${n}</div>
      <div style="font-size:12px;color:#64748b;margin-top:3px">${rot}</div>
    </button>`;

  $("corpo").innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px">
      ${cartao("falta", faltam, "esperando anúncio", "#b45309")}
      ${cartao("ja", noAr.length, `já ${naNo(estado.mkt)}`, c.fg === "#ffffff" ? "#1a1a1a" : c.fg)}
      ${cartao("", estado.produtos.length, "no total", "")}
    </div>
    <div style="display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center">
      <input id="busca" class="finput" style="width:230px" placeholder="Buscar produto, SKU ou cliente…" value="${esc(estado.busca)}">
      <select id="fcliente" class="finput" style="width:auto;padding-right:30px">
        <option value="">Todos os clientes</option>
        ${clientes.map((n) => `<option value="${esc(n)}"${estado.cliente === n ? " selected" : ""}>${esc(n)}</option>`).join("")}
      </select>
      <select id="ordem" class="finput" style="width:auto;padding-right:30px">
        <option value="falta"${estado.ordem === "falta" ? " selected" : ""}>Fila de trabalho</option>
        <option value="margem"${estado.ordem === "margem" ? " selected" : ""}>Maior margem em outro marketplace</option>
        <option value="nome"${estado.ordem === "nome" ? " selected" : ""}>Nome</option>
      </select>
    </div>
    <div class="card" style="overflow:hidden">
      <table>
        <thead style="background:#f8fafc"><tr>
          <th style="width:32%">Produto</th><th style="width:16%">Cliente</th><th style="width:10%">SKU</th>
          <th style="width:12%">Custo</th><th style="width:18%">Preço em outro marketplace</th><th></th>
        </tr></thead>
        <tbody>${lista.map((p) => linhaEsp(p, info.get(p.id))).join("") || `<tr><td colspan="6" style="color:var(--muted);padding:26px 16px">Nada por aqui.</td></tr>`}</tbody>
      </table>
    </div>
    <div style="margin-top:12px;font-size:12px;color:var(--muted)">Mostrando ${lista.length} de ${estado.produtos.length} produtos</div>`;

  $("busca").oninput = (e) => { estado.busca = e.target.value; const k = e.target.selectionStart; desenhar(); const b = $("busca"); b.focus(); b.setSelectionRange(k, k); };
  $("ordem").onchange = (e) => { estado.ordem = e.target.value; desenhar(); };
  $("fcliente").onchange = (e) => { estado.cliente = e.target.value; desenhar(); };
  document.querySelectorAll("[data-fila]").forEach((b) => {
    b.onclick = () => { estado.faltaEm = estado.faltaEm === b.dataset.fila ? "" : b.dataset.fila; desenhar(); };
  });
  document.querySelectorAll("[data-prod]").forEach((tr) => {
    tr.onclick = () => { estado.aberto = estado.produtos.find((p) => p.id === tr.dataset.prod); desenhar(); };
  });
}

function linhaEsp(p, i) {
  const meu = i.meus.find((a) => (a.mkt || a.storeMkt) === estado.mkt);
  const outros = i.meus.filter((a) => (a.mkt || a.storeMkt) !== estado.mkt);
  const ref = outros.map((a) => a.preco).filter((x) => x !== null && x !== undefined);
  const c = cor(estado.mkt);
  return `<tr data-prod="${esc(p.id)}">
    <td><div style="font-weight:600">${esc(p.nome || "sem nome")}</div>
      ${outros.length ? `<div style="font-size:11.5px;color:var(--muted)">já em ${esc([...new Set(outros.map((a) => a.mkt || a.storeMkt))].join(", "))}</div>` : ""}</td>
    <td style="font-size:12.5px;color:var(--ink-2)">${esc(p.custNome || "—")}</td>
    <td style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2)">${esc(p.sku || "—")}</td>
    <td style="font-variant-numeric:tabular-nums;font-size:12.5px">${moeda(p.custo)}</td>
    <td style="font-variant-numeric:tabular-nums;font-size:12.5px">${ref.length
      ? (Math.min(...ref) === Math.max(...ref) ? moeda(ref[0]) : `${moeda(Math.min(...ref))}<span style="color:var(--muted)"> a </span>${moeda(Math.max(...ref))}`)
      : `<span style="color:var(--muted)">—</span>`}</td>
    <td>${meu
      ? `<span class="selo" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${moeda(meu.preco)}</span>`
      : `<span class="falta">falta anunciar</span>`}</td>
  </tr>`;
}

function linha(p, i) {
  const selos = estado.mkts.map((m) => {
    const c = cor(m);
    return i.mkts.includes(m)
      ? `<span class="selo" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${esc(m)}</span>`
      : `<span class="falta">${esc(m)}</span>`;
  }).join(" ");
  const preco = !i.precos.length ? "—"
    : i.precos.length === 1 || Math.min(...i.precos) === Math.max(...i.precos) ? moeda(i.precos[0])
    : `${moeda(Math.min(...i.precos))}<span style="color:var(--muted)"> a </span>${moeda(Math.max(...i.precos))}`;
  // Ficha incompleta fica visível na lista, não só na hora de salvar: é o que
  // faz o cliente voltar e preencher o que falta para o produto ser anunciado.
  const falta = faltandoNaFicha(p);
  return `<tr data-prod="${esc(p.id)}">
    <td><div style="font-weight:600">${esc(p.nome || "sem nome")}</div>
      ${p.custo !== undefined ? `<div style="font-size:11.5px;color:var(--muted)">custo ${moeda(p.custo)}</div>` : ""}
      ${falta.length ? `<div style="font-size:11.5px;color:#b45309;margin-top:2px" title="${esc(falta.join(", "))}">⚠ ${falta.length === 1 ? "falta 1 informação" : `faltam ${falta.length} informações`}</div>` : ""}</td>
    <td style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2)">${esc(p.sku || "—")}</td>
    <td style="font-variant-numeric:tabular-nums;font-size:12.5px">${preco}</td>
    <td>${i.melhor
      ? `<span style="font-weight:600;color:#3b6d11;font-variant-numeric:tabular-nums">${Number(i.melhor.margem).toFixed(1)}%</span>
         <span style="font-size:11.5px;color:var(--muted)"> ${esc(i.melhor.mkt || i.melhor.storeMkt || "")}</span>`
      : `<span style="font-size:12px;color:var(--muted)">—</span>`}</td>
    <td><div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">${selos}
      <button data-editar="${esc(p.id)}" class="btnsm" style="padding:3px 9px;font-size:11.5px;margin-left:2px">editar</button></div></td>
  </tr>`;
}

// Miniatura de foto/vídeo hospedado no Drive. Link de pasta ou não
// reconhecido não vira miniatura — a tela mantém só o link "📁 Fotos e vídeos".
function tileMidia(link, rotulo) {
  const img = urlImagemDrive(link, 400);
  if (!img) return "";
  return `<a class="midia" href="${esc(urlAbrirDrive(link))}" target="_blank" rel="noopener" data-midia>
    <img src="${esc(img)}" alt="${esc(rotulo)}" loading="lazy">
    <span class="cap">${esc(rotulo)}</span>
  </a>`;
}

function gradeMidias(p) {
  const fotos = Array.isArray(p.fotos) ? p.fotos : (p.fotos ? [p.fotos] : []);
  const videos = Array.isArray(p.video) ? p.video : (p.video ? [p.video] : []);
  const tiles = [
    ...fotos.map((u) => tileMidia(u, "Foto")),
    ...videos.map((u) => tileMidia(u, "Vídeo")),
  ].filter(Boolean);
  return tiles.length ? `<div class="midias">${tiles.join("")}</div>` : "";
}

// Imagem do Drive que não carregou. A causa pode ser permissão, link errado
// ou rede — o aviso não afirma qual, só diz o que conferir. Mesma disciplina
// da guarda do Prêmio de Seguidor, que não acusa sem ter certeza.
window.driveQuebrou = function (imgEl) {
  const a = imgEl.closest(".midia");
  if (!a) return;
  a.classList.add("midia-erro");
  a.innerHTML = `<span>⚠️</span><span>Não foi possível carregar esta imagem. Confira se o arquivo do Drive está como <b>"qualquer pessoa com o link"</b>. <b>Abrir no Drive ↗</b></span>`;
};

// A margem de um anúncio, na ordem que a decisão travada do projeto manda:
// o que veio da PLANILHA vale e nunca é recalculado — ela já desconta
// comissão, frete e imposto reais. Só onde não há número gravado é que a
// estimativa entra, e entra dizendo que é estimativa.
function blocoMargem(a, p) {
  const rot = `<div style="font-size:11.5px;color:#64748b">Margem de contribuição</div>`;
  const temLucro = a.lucro !== null && a.lucro !== undefined;
  const temMargem = a.margem !== null && a.margem !== undefined;
  if (temLucro || temMargem) {
    return `<div>${rot}<div style="font-size:15px;font-weight:600;color:#3b6d11">${temLucro ? moeda(a.lucro) : ""}${temMargem ? `<span style="font-size:12px;color:#64748b;font-weight:500">${temLucro ? " · " : ""}${Number(a.margem).toFixed(1)}%</span>` : ""}</div></div>`;
  }
  const r = calcularMargem({
    preco: a.preco === null || a.preco === undefined ? null : Number(a.preco),
    custo: p && p.custo !== undefined ? p.custo : null,
    peso: p ? p.peso : "", mkt: a.mkt || a.storeMkt,
  });
  if (r.lucro === null) {
    return `<div>${rot}<div style="font-size:12.5px;color:var(--muted)" title="${esc(r.falta.join(", "))}">falta ${esc(r.falta[0] || "informação")}</div></div>`;
  }
  // Enquanto a tabela do marketplace não tiver TUDO que a planilha desconta, a
  // estimativa sai otimista — nos exemplos conferidos, 52% onde o real é da
  // ordem de 7%. Mostrar isso ao dono do produto é pior do que não mostrar
  // nada: ele decide preço em cima de um número que não existe.
  if (!r.completa && !estado.souEquipe && estado.modo === "cliente") {
    return `<div>${rot}<div style="font-size:12.5px;color:var(--muted)">ainda não informada</div></div>`;
  }
  const detalhe = r.descontos.map((d) => `${d.rotulo} -${moeda(d.valor)}`).join(" | ");
  return `<div>${rot}
    <div style="font-size:15px;font-weight:600;color:${r.lucro >= 0 ? "#3b6d11" : "#b91c1c"}" title="${esc(detalhe)}">${moeda(r.lucro)}<span style="font-size:12px;color:#64748b;font-weight:500"> · ${r.margem.toFixed(1).replace(".", ",")}%</span></div>
    <div style="font-size:11px;color:#94a3b8">estimativa pelas taxas do marketplace</div></div>`;
}

function telaProduto() {
  const p = estado.aberto;
  $("titulo").textContent = p.nome || "Produto";
  $("resumo").textContent = p.sku ? "SKU " + p.sku : "";
  const meus = anunciosDe(p);
  const tem = mktsDe(p);

  const cartaoAnuncio = (a) => {
    const c = cor(a.mkt || a.storeMkt);
    return `<div class="card" style="overflow:hidden;margin-bottom:12px">
      <div style="padding:11px 18px;background:${c.bg};border-bottom:1px solid ${c.bd};display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <b style="color:${c.fg};font-size:13.5px">${esc(a.mkt || a.storeMkt || "—")}</b>
        <span style="font-size:11.5px;color:${c.fg};opacity:.85">${esc(a.storeNome || "")}</span>
      </div>
      <div style="padding:13px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;align-items:center">
        <div><div style="font-size:11.5px;color:#64748b">Preço</div><div style="font-size:15px;font-weight:600">${moeda(a.preco)}</div></div>
        ${blocoMargem(a, p)}
        ${a.link ? `<div style="text-align:right"><a href="${esc(a.link)}" target="_blank" rel="noopener" class="btnsm" style="text-decoration:none;display:inline-block">Ver anúncio</a></div>` : ""}
      </div>
    </div>`;
  };

  // O especialista não "pede" anúncio: ele cria. Onde o cliente vê o botão de
  // pedir, ele vê o formulário de registrar o que subiu.
  const formEsp = estado.modo === "especialista" ? blocoRegistro(p, meus) : "";

  const faltando = estado.modo === "especialista" ? "" : estado.mkts.filter((m) => !tem.includes(m)).map((m) => {
    const c = cor(m);
    return `<div class="card" style="overflow:hidden;border-style:dashed;box-shadow:none;background:#fcfcfd;margin-bottom:12px">
      <div style="padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div><div style="font-size:14px;font-weight:600;color:var(--ink-2)">${esc(m)}</div>
          <div style="font-size:11.5px;color:var(--muted)">Este produto ainda não está anunciado aqui</div></div>
        <button data-quero="${esc(m)}" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd};border-radius:9px;padding:9px 18px;font-size:13px;font-weight:700">Quero anunciar ${esc(naNo(m))}</button>
      </div>
    </div>`;
  }).join("");

  $("corpo").innerHTML = `
    <div style="display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start" id="grade">
      <div class="card" style="padding:18px 20px">
        <div style="font-size:15px;font-weight:700;line-height:1.3;margin-bottom:8px">${esc(p.nome || "")}</div>
        ${p.sku ? `<div style="display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--brand-tint);background:var(--brand-50);border:1px solid var(--brand-100);border-radius:6px;padding:2px 8px;margin-bottom:12px">${esc(p.sku)}</div>` : ""}
        <div class="lin" style="border-top:none"><span style="color:#64748b">Custo</span><b>${moeda(p.custo)}</b></div>
        ${p.peso ? `<div class="lin"><span style="color:#64748b">Peso</span><b>${esc(p.peso)}</b></div>` : ""}
        ${p.medidasProduto ? `<div class="lin"><span style="color:#64748b">Medidas do produto</span><b style="text-align:right">${esc(p.medidasProduto)}</b></div>` : ""}
        ${p.medidas ? `<div class="lin"><span style="color:#64748b">Medidas da embalagem</span><b style="text-align:right">${esc(p.medidas)}</b></div>` : ""}
        ${p.material ? `<div class="lin"><span style="color:#64748b">Material</span><b style="text-align:right">${esc(p.material)}</b></div>` : ""}
        ${p.tamanhos ? `<div class="lin"><span style="color:#64748b">Tamanhos</span><b style="text-align:right">${esc(p.tamanhos)}</b></div>` : ""}
        ${p.cores ? `<div class="lin"><span style="color:#64748b">Cores</span><b style="text-align:right">${esc(p.cores)}</b></div>` : ""}
        ${p.fotos && !Array.isArray(p.fotos) ? `<div style="margin-top:14px"><a href="${esc(p.fotos)}" target="_blank" rel="noopener" class="btnsm" style="text-decoration:none;display:inline-block">📁 Fotos e vídeos</a></div>` : ""}
        ${gradeMidias(p)}
        ${p.obs ? `<div style="margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9">
          <div style="font-size:11.5px;color:#64748b;margin-bottom:4px">Observações</div>
          <div style="font-size:12.5px;white-space:pre-wrap;line-height:1.55">${esc(p.obs)}</div></div>` : ""}
        ${estado.modo !== "especialista" && faltandoNaFicha(p).length ? `<div style="margin-top:14px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:10px 12px;font-size:12px;color:#92400e;line-height:1.5">
          <b>Falta preencher:</b> ${esc(faltandoNaFicha(p).join(", "))}.<br>Sem isso não dá para anunciar este produto.
        </div>` : ""}
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid #f1f5f9;font-size:11.5px;color:var(--muted);line-height:1.6">
          Estes dados valem para todos os marketplaces onde você vende.
        </div>
        ${estado.modo !== "especialista" ? `<button data-editar="${esc(p.id)}" class="btnsm" style="width:100%;margin-top:12px">Editar ficha</button>` : ""}
      </div>
      <div>
        <div style="font-size:13px;font-weight:700;color:#334155;margin-bottom:10px">Anúncios deste produto</div>
        ${meus.map(cartaoAnuncio).join("") || `<div class="card" style="padding:16px;color:var(--muted);font-size:13px;margin-bottom:12px">Nenhum anúncio registrado ainda.</div>`}
        ${faltando}
        ${formEsp}
      </div>
    </div>`;
  if (window.matchMedia("(max-width:720px)").matches) $("grade").style.gridTemplateColumns = "1fr";
  document.querySelectorAll("[data-quero]").forEach((b) => { b.onclick = () => popup(b.dataset.quero, p); });
  document.querySelectorAll("[data-editar]").forEach((b) => { b.onclick = () => abrirFicha(p); });
  document.querySelectorAll("[data-midia] img").forEach((im) => { im.onerror = () => driveQuebrou(im); });
  if (estado.modo === "especialista") ligarRegistro(p, meus);
}

function telaLojas() {
  $("titulo").textContent = "Minhas lojas";
  $("resumo").textContent = "";
  const porLoja = new Map();
  for (const a of estado.anuncios) {
    const k = a.storeNome || a.mkt || "—";
    const v = porLoja.get(k) || { nome: k, mkt: a.mkt || a.storeMkt || "", anuncios: 0, produtos: new Set() };
    v.anuncios++; if (a.produtoId) v.produtos.add(a.produtoId);
    porLoja.set(k, v);
  }
  const lojas = [...porLoja.values()];
  $("corpo").innerHTML = lojas.length ? `
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px">
      ${lojas.map((l) => { const c = cor(l.mkt); return `
        <div class="card" style="padding:16px 18px;border-top:3px solid ${c.bd}">
          <div style="font-weight:700;font-size:14px;margin-bottom:3px">${esc(l.nome)}</div>
          <span class="selo" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${esc(l.mkt || "—")}</span>
          <div style="margin-top:12px;font-size:13px;color:var(--ink-2)">${l.produtos.size || l.anuncios} produto(s) · ${l.anuncios} anúncio(s)</div>
        </div>`; }).join("")}
    </div>` : `<div class="card" style="padding:20px;color:var(--muted);font-size:13px">Ainda não há lojas registradas.</div>`;
}

// ─── pop-up do "quero anunciar" ───────────────────────────────────────
// Agora registra de verdade: grava um documento em `pedidos`, que a equipe
// vê em 📦 Produtos. Antes só mostrava uma mensagem e ninguém recebia.
//
// Id determinístico (custId__produtoId__mkt, ou custId__geral__mkt): clicar
// de novo no mesmo pedido atualiza em vez de criar um segundo. `criadoPor`
// guarda quem digitou (pode ser a equipe entrando como cliente) e `emNomeDe`
// por quem — a autoria dupla de sempre.
const chaveMkt = (m) => String(m || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "mkt";

async function popup(mkt, p) {
  const produtoId = p && p.id ? p.id : null;
  const produtoNome = produtoId ? (p.nome || "") : "todos os seus produtos";
  const custNome = (p && p.custNome)
    || (estado.produtos.find((x) => x.custNome) || {}).custNome
    || estado.nome || "";
  const id = `${estado.custId}__${produtoId || "geral"}__${chaveMkt(mkt)}`;
  const agora = new Date().toISOString();

  $("popConteudo").style.maxWidth = "470px";
  $("popConteudo").style.textAlign = "center";
  $("popConteudo").innerHTML = `
    <div style="width:44px;height:44px;border-radius:50%;border:3px solid #e2e8f0;border-top-color:var(--brand);margin:14px auto 16px;animation:girar .8s linear infinite"></div>
    <style>@keyframes girar{to{transform:rotate(360deg)}}</style>
    <div style="font-size:14.5px;color:var(--ink-2)">Registrando seu pedido…</div>`;
  $("mask").classList.add("ver");

  try {
    const ref = doc(db, "pedidos", id);
    const jaExiste = (await getDoc(ref)).exists();
    await setDoc(ref, {
      custId: estado.custId,
      custNome,
      produtoId,
      produtoNome,
      mkt,
      status: "aberto",
      atualizadoEm: agora,
      ...(jaExiste ? {} : {
        criadoEm: agora,
        criadoPor: { uid: (auth.currentUser && auth.currentUser.uid) || "", emNomeDe: estado.custId },
      }),
    }, { merge: true });

    $("popConteudo").innerHTML = `
      <div style="width:60px;height:60px;border-radius:50%;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:700;margin:0 auto 18px">✓</div>
      <div style="font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px">Pedido registrado</div>
      <div style="font-size:14.5px;color:var(--ink-2);line-height:1.6;margin-bottom:22px">A equipe da OTDE recebeu seu pedido para anunciar ${esc(produtoNome)} ${esc(naNo(mkt))} e vai cuidar disso.${jaExiste ? "<br>Você já tinha pedido este — atualizamos a data." : ""}</div>
      <div style="font-size:12px;color:var(--muted);background:#f8fafc;border:1px solid #eef2f7;border-radius:10px;padding:9px 14px;margin-bottom:22px;line-height:1.5"><b style="color:var(--ink-2)">${esc(mkt)}</b> · ${esc(produtoNome)}</div>
      <button id="popOk" class="btn">Entendi</button>`;
  } catch (e) {
    console.error("pedido:", e);
    $("popConteudo").innerHTML = `
      <div style="width:60px;height:60px;border-radius:50%;background:#f59e0b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:700;margin:0 auto 18px">!</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:10px">Não deu para registrar agora</div>
      <div style="font-size:14px;color:var(--ink-2);line-height:1.6;margin-bottom:22px">Tente de novo daqui a pouco. Se continuar, fale no grupo pedindo para anunciar ${esc(naNo(mkt))}.</div>
      <button id="popOk" class="btn">Fechar</button>`;
  }
  $("popOk").onclick = fechar;
}
const fechar = () => $("mask").classList.remove("ver");
$("mask").onclick = (e) => { if (e.target === $("mask")) fechar(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fechar(); });

// ─── A FICHA DO PRODUTO ───────────────────────────────────────────────
//
// Serve a duas pessoas na mesma tela. O CLIENTE preenche a ficha do produto
// dele, que antes só entrava por planilha. A EQUIPE usa a mesma tela para
// consertar o que a importação errou — nome que não bate, SKU do anúncio
// trocado — e só ela vê desvincular anúncio e apagar produto.
//
// A gravação NÃO é direta no Firestore. A regra proíbe o cliente de escrever
// `mkts`, e sem esse campo o produto nasce invisível para o especialista, que
// é justamente quem precisa dele para anunciar. Quem grava é o backend, que
// carimba os marketplaces do proprietário.

function abrirFicha(p) {
  const criando = !p;
  const produto = p || {};
  const meus = criando ? [] : anunciosDe(produto);

  // Os campos vêm da MESMA lista que o backend usa para recusar a gravação
  // (o ficha-produto importado acima, espelhado em functions/). Se estivessem
  // escritos duas vezes, a tela pediria uma coisa e o servidor recusaria outra.
  //
  // Não escreva o caminho com pasta em comentário aqui: o carimbo de versão
  // varre o arquivo inteiro e trata QUALQUER menção sem ?v= como referência
  // sem carimbo, o que barra a publicação.
  const valorDe = (c) => {
    const v = produto[c.campo];
    return Array.isArray(v) ? v.join("\n") : (v ?? "");
  };
  const campo = (c) => {
    const entrada = c.longo
      ? `<textarea id="ed-${c.campo}" class="finput" rows="${c.linhas || 3}" style="resize:vertical;font:inherit" placeholder="${esc(c.dica || "")}">${esc(valorDe(c))}</textarea>`
      : `<input id="ed-${c.campo}" class="finput" value="${esc(valorDe(c))}" placeholder="${esc(c.dica || "")}">`;
    return `<div style="margin-bottom:11px">
      <span class="rot">${esc(c.rotulo)}${c.obrigatorio ? ` <b style="color:#b91c1c">*</b>` : ""}</span>
      ${entrada}
    </div>`;
  };
  const obrigatorios = CAMPOS_DA_FICHA.filter((c) => c.obrigatorio);
  const opcionais = CAMPOS_DA_FICHA.filter((c) => !c.obrigatorio);
  const custoAtual = (produto.custo === null || produto.custo === undefined)
    ? "" : String(produto.custo).replace(".", ",");

  $("popConteudo").style.maxWidth = "580px";
  $("popConteudo").style.textAlign = "left";
  $("popConteudo").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px">
      <div>
        <div style="font-size:16px;font-weight:800">${criando ? "Novo produto" : "Ficha do produto"}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">Os campos com <b style="color:#b91c1c">*</b> são o que quem for anunciar precisa saber.</div>
      </div>
      <button id="ed-x" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer">✕</button>
    </div>

    <div id="ed-erro" role="alert" style="display:none;background:#fef2f2;color:#b91c1c;border-radius:9px;padding:10px 13px;font-size:12.5px;margin-bottom:14px;line-height:1.5"></div>

    ${obrigatorios.map(campo).join("")}

    <details style="margin:14px 0 4px"${opcionais.some((c) => valorDe(c)) ? " open" : ""}>
      <summary style="cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:600">Mais detalhes (opcional)</summary>
      <div style="margin-top:12px">${opcionais.map(campo).join("")}</div>
    </details>

    <div style="margin-bottom:4px">
      <span class="rot">Custo</span>
      <input id="ed-custo" class="finput" inputmode="decimal" value="${esc(custoAtual)}" placeholder="0,00">
      <div style="font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5">Quanto o produto custa para você. Sem ele não dá para calcular a sua margem. Deixar em branco não apaga o custo que já estiver salvo.</div>
    </div>

    ${estado.souEquipe && !criando ? `
    <div style="margin-top:16px;border-top:1px solid #f1f5f9;padding-top:14px">
      <div style="font-size:11px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px">Anúncios deste produto</div>
      ${meus.length ? meus.map((a) => {
        const c = cor(a.mkt || a.storeMkt);
        return `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;flex-wrap:wrap">
          <div style="min-width:0">
            <span class="selo" style="background:${c.bg};color:${c.fg};border:1px solid ${c.bd}">${esc(a.mkt || a.storeMkt || "—")}</span>
            <span style="font-size:12px;color:var(--ink-2);margin-left:7px">${esc(a.storeNome || "")}</span>
            <div style="font-size:11.5px;color:var(--muted);margin-top:3px;font-family:ui-monospace,Menlo,monospace">${esc(a.sku || a.itemId || "sem código")} · ${moeda(a.preco)}</div>
          </div>
          <button data-desv="${esc(a.id)}" class="btnsm" style="color:#b91c1c;white-space:nowrap">Desvincular</button>
        </div>`;
      }).join("") : `<div style="font-size:12.5px;color:var(--muted)">Nenhum anúncio.</div>`}
      <div style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:6px">Desvincular apaga o anúncio daqui. O anúncio no marketplace continua no ar — some só desta tela, e volta se você reimportar a planilha.</div>
    </div>` : ""}

    <div style="display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap">
      ${estado.souEquipe && !criando ? `<button id="ed-apagar" class="btnsm" style="color:#b91c1c">Apagar produto</button>` : `<span></span>`}
      <div style="display:flex;gap:8px">
        <button id="ed-cancelar" class="btnsm">Cancelar</button>
        <button id="ed-salvar" class="btn" style="width:auto;padding:9px 20px">Salvar</button>
      </div>
    </div>`;
  $("mask").classList.add("ver");

  // Botão dentro de modal não é alcançado por delegação neste projeto: cada um
  // é ligado à mão, aqui, logo depois do innerHTML.
  $("ed-x").onclick = $("ed-cancelar").onclick = fechar;

  document.querySelectorAll("[data-desv]").forEach((b) => {
    b.onclick = async () => {
      b.disabled = true; b.textContent = "…";
      try {
        await deleteDoc(doc(db, "listings", b.dataset.desv));
        estado.anuncios = estado.anuncios.filter((x) => x.id !== b.dataset.desv);
        abrirFicha(produto);
      } catch (e) { alert("Não consegui desvincular: " + (e.message || "")); b.disabled = false; b.textContent = "Desvincular"; }
    };
  });

  const apagar = $("ed-apagar");
  if (apagar) apagar.onclick = async () => {
    if (!confirm(`Apagar "${produto.nome}"? Os anúncios dele ficam sem produto.`)) return;
    try {
      await deleteDoc(doc(db, "products", produto.id));
      estado.produtos = estado.produtos.filter((x) => x.id !== produto.id);
      estado.aberto = null; fechar(); desenhar();
    } catch (e) { alert("Não consegui apagar: " + (e.message || "")); }
  };

  $("ed-salvar").onclick = async () => {
    const v = (id) => ($(`ed-${id}`) || {}).value ?? "";
    const dados = { custo: v("custo") };
    for (const c of CAMPOS_DA_FICHA) dados[c.campo] = v(c.campo);
    if (!criando) dados.id = produto.id;
    // A equipe entrando como cliente precisa dizer de quem é a ficha. O
    // cliente não: para ele vale a claim do token, não o que a tela mandar.
    if (estado.souEquipe) dados.custId = estado.custId;

    const erro = $("ed-erro");
    const mostrarErro = (t) => { erro.textContent = t; erro.style.display = "block"; };
    erro.style.display = "none";

    // A tela confere antes de ir ao servidor, com a MESMA lista que ele usa.
    // É só para não fazer o cliente esperar a ida e volta: quem decide é o
    // backend, que confere de novo.
    const faltando = faltandoNaFicha(dados);
    if (faltando.length) {
      mostrarErro(faltando.length === 1
        ? `Falta preencher: ${faltando[0]}.`
        : `Faltam preencher: ${faltando.join(", ")}.`);
      const primeiro = CAMPOS_DA_FICHA.find((c) => c.rotulo === faltando[0]);
      if (primeiro && $(`ed-${primeiro.campo}`)) $(`ed-${primeiro.campo}`).focus();
      return;
    }

    const b = $("ed-salvar"); b.disabled = true; b.textContent = "Salvando...";
    try {
      const r = await salvarFicha(dados);
      const salvo = r.produto || {};
      if (criando) {
        estado.produtos = estado.produtos
          .filter((x) => x.id !== r.id)
          .concat([{ ...salvo, id: r.id }])
          .sort((x, y) => (x.nome || "").localeCompare(y.nome || "", "pt-BR"));
        // O produto novo pode trazer marketplaces que esta tela ainda não
        // conhecia — sem isto o "Quero anunciar" dele não apareceria.
        estado.mkts = [...new Set(estado.mkts.concat(salvo.mkts || []))];
        estado.aberto = estado.produtos.find((x) => x.id === r.id) || null;
      } else {
        Object.assign(produto, salvo);
      }
      fechar(); desenhar();
    } catch (e) {
      mostrarErro(e.message || "Não consegui salvar.");
      b.disabled = false; b.textContent = "Salvar";
    }
  };
}

// ─── O ESPECIALISTA REGISTRA O ANÚNCIO QUE CRIOU ──────────────────────
//
// Funciona antes de qualquer integração: ele anuncia no marketplace dele e
// digita aqui o preço e o link. É o que destrava Mercado Livre e TikTok sem
// esperar API — e no dia em que a API existir, ela preenche este mesmo campo.
//
// A conta que aparece enquanto ele digita é PREÇO MENOS CUSTO, e está escrito
// que é bruta. As taxas de cada marketplace não estão no sistema, e chamar
// isso de "margem de contribuição" seria repetir o erro que já quase foi
// parar na tela do cliente.
function blocoRegistro(p, meus) {
  const meu = meus.find((a) => (a.mkt || a.storeMkt) === estado.mkt);
  const c = cor(estado.mkt);
  return `
    <div class="card" style="overflow:hidden;margin-top:4px;border-color:${c.bd}">
      <div style="padding:11px 18px;background:${c.bg};border-bottom:1px solid ${c.bd}">
        <b style="color:${c.fg};font-size:13.5px">${meu ? "Atualizar" : "Registrar"} o anúncio ${esc(naNo(estado.mkt))}</b>
      </div>
      <div style="padding:15px 18px">
        <div style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:end">
          <div><span class="rot">Preço de venda</span><input id="rg-preco" class="finput" inputmode="decimal" value="${meu && meu.preco != null ? String(meu.preco).replace(".", ",") : ""}" placeholder="0,00"></div>
          <div><span class="rot">Link do anúncio (opcional)</span><input id="rg-link" class="finput" value="${esc(meu ? meu.link || "" : "")}" placeholder="https://..."></div>
        </div>
        <div id="rg-conta" style="font-size:12.5px;color:var(--ink-2);margin-top:11px;min-height:19px"></div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap">
          <button id="rg-salvar" class="btn" style="width:auto;padding:10px 20px">${meu ? "Salvar" : "Registrar anúncio"}</button>
          ${meu ? `<button id="rg-remover" class="btnsm" style="color:#b91c1c">Remover</button>` : ""}
          <span id="rg-aviso" style="font-size:12px;color:var(--muted)"></span>
        </div>
      </div>
    </div>`;
}

function ligarRegistro(p, meus) {
  const preco = $("rg-preco"), link = $("rg-link"), conta = $("rg-conta");
  if (!preco) return;
  const meu = meus.find((a) => (a.mkt || a.storeMkt) === estado.mkt);
  const numero = (v) => {
    const t = String(v || "").replace(/[R$\s]/g, "").replace(/\./g, "").replace(",", ".");
    const n = Number(t);
    return t === "" || !isFinite(n) ? null : n;
  };
  // Isto mostrava "preço menos custo", chamado de bruto. Era o número que dá
  // 52% onde o real é 7,5% — o mesmo erro que a decisão travada do projeto
  // manda nunca cometer. Agora a conta desconta as taxas de verdade e mostra
  // de onde cada real saiu.
  const recalcular = () => {
    const v = numero(preco.value);
    if (v === null) { conta.textContent = ""; return; }
    const r = calcularMargem({
      preco: v, custo: p.custo === undefined ? null : p.custo,
      peso: p.peso, mkt: estado.mkt,
    });
    if (r.lucro === null) {
      conta.innerHTML = `<span style="color:var(--muted)">Para calcular a margem falta ${esc(r.falta.join(", "))}.</span>`;
      return;
    }
    const cores = r.lucro >= 0 ? "#3b6d11" : "#b91c1c";
    conta.innerHTML = `Sobra para você: <b style="color:${cores}">${moeda(r.lucro)}</b>
      <span style="color:var(--muted)">· ${r.margem.toFixed(1).replace(".", ",")}% do preço</span>
      <div style="color:var(--muted);font-size:11.5px;margin-top:5px;line-height:1.6">
        ${r.descontos.map((d) => `${esc(d.rotulo)} −${moeda(d.valor)}`).join("<br>")}
        ${r.avisos.length ? `<br>${r.avisos.map(esc).join("<br>")}` : ""}
      </div>
      ${r.completa ? "" : `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 10px;font-size:11.5px;color:#92400e;margin-top:7px;line-height:1.5">Esta conta ainda está incompleta e sobra <b>mais do que vai sobrar de verdade</b>. Use como teto, não como margem.</div>`}`;
  };
  preco.oninput = recalcular;
  recalcular();

  $("rg-salvar").onclick = async () => {
    const v = numero(preco.value);
    if (v === null) { $("rg-aviso").textContent = "Informe o preço."; return; }
    const b = $("rg-salvar"); b.disabled = true; b.textContent = "Salvando...";
    // Id previsível: salvar de novo ATUALIZA o anúncio em vez de criar outro.
    const id = meu ? meu.id : `esp_${estado.mkt.toLowerCase().replace(/[^a-z0-9]+/g, "-")}__${p.id}`;
    const doc0 = {
      id, custId: p.custId, custNome: p.custNome || "", produtoId: p.id, chave: p.chave || "",
      sku: p.sku || "", mkt: estado.mkt, mkts: p.mkts || [estado.mkt],
      preco: v, link: link.value.trim(), storeNome: "", storeMkt: estado.mkt,
      origem: "especialista", atualizadoEm: new Date().toISOString(),
    };
    try {
      await setDoc(doc(db, "listings", id), doc0, { merge: true });
      const i = estado.anuncios.findIndex((a) => a.id === id);
      if (i >= 0) estado.anuncios[i] = { ...estado.anuncios[i], ...doc0 }; else estado.anuncios.push(doc0);
      desenhar();
    } catch (e) {
      $("rg-aviso").textContent = "Não consegui salvar: " + (e.message || "");
      b.disabled = false; b.textContent = meu ? "Salvar" : "Registrar anúncio";
    }
  };
  const rem = $("rg-remover");
  if (rem) rem.onclick = async () => {
    if (!confirm("Remover o registro deste anúncio? O anúncio no marketplace continua no ar.")) return;
    try {
      await deleteDoc(doc(db, "listings", meu.id));
      estado.anuncios = estado.anuncios.filter((a) => a.id !== meu.id);
      desenhar();
    } catch (e) { $("rg-aviso").textContent = "Não consegui remover: " + (e.message || ""); }
  };
}
</script>
</body>
</html>
