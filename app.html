<style>
*{box-sizing:border-box;margin:0;padding:0}

}

::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#C9C4B8;border-radius:3px}
/* ─── FICHAS DOS CLIENTES (aba Produtos) ────────────────────────────

   TUDO aqui é escopado em .tv de propósito: o sistema é claro e este
   painel é escuro, e uma regra solta pintaria de preto a tela ao lado.

   Os tamanhos são para leitura a metros, não a 60 cm: o menor texto tem
   16px e a tarja de tempo tem 30px. Não reduza para caber mais cartão —
   o que não cabe aparece quando os de cima saírem. */

.tv-pulso{display:flex;align-items:center;gap:26px;padding:16px 30px;border-bottom:1px solid #1E1B14;flex-shrink:0}
.tv-marca{display:flex;align-items:center;gap:11px;flex-shrink:0}
.tv-logo{width:36px;height:36px;border-radius:50%;background:var(--brand);display:flex;align-items:center;
  justify-content:center;color:#fff;font-weight:800;font-size:16px}
.tv-nome{font-size:21px;font-weight:800;letter-spacing:-.02em}
.tv-numeros{display:flex;align-items:center;gap:20px}
.tv-bloco{display:flex;align-items:baseline;gap:9px}
.tv-big{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tv-rot{font-size:15px;font-weight:600;color:#8E8B84}
.tv-media .tv-rot{color:#6B6A66}
.tv-sep{width:1px;height:34px;background:#1E1B14;flex-shrink:0}
.tv-alerta{background:#7f1d1d;border-radius:10px;padding:7px 15px}
.tv-alerta .tv-big{font-size:30px}
.tv-alerta .tv-rot{color:#fecaca}
.tv-direita{margin-left:auto;display:flex;align-items:center;gap:20px;flex-shrink:0}
.tv-rot-cap{font-size:13px;color:#6B6A66;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.tv-antiga{text-align:right}
.tv-antiga-val{font-size:24px;font-weight:800;color:#fca5a5;line-height:1.15;font-variant-numeric:tabular-nums}
.tv-relogio{text-align:right}
.tv-data{font-size:13px;color:#6B6A66}
.tv-hora{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.tv-sair{background:none;border:none;color:#4A463D;font-size:19px;cursor:pointer;padding:6px 9px;border-radius:8px;line-height:1}
.tv-sair:hover{background:#1E1B14;color:#8E8B84}

/* A exceção só existe quando existe: é o que a equipe NÃO resolve sozinha,
   e por isso não pode ficar enterrada entre os cartões. */
.tv-excecao{display:flex;align-items:center;gap:14px;padding:11px 30px;background:#271a06;
  border-bottom:1px solid #422006;flex-shrink:0}
.tv-exc-ico{width:21px;height:21px;color:#fbbf24;flex-shrink:0}
.tv-exc-forte{font-size:17px;font-weight:700;color:#fbbf24;flex-shrink:0}
.tv-exc-det{font-size:16px;color:#d97706;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-exc-acao{margin-left:auto;font-size:15px;font-weight:700;color:#fbbf24;background:none;
  border:1px solid #8A6420;border-radius:8px;padding:6px 14px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.tv-exc-acao:hover{background:#422006}

.tv-grade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
  gap:15px;padding:15px 30px;flex-grow:1;min-height:0}
.tv-card{background:#111a2e;border:1px solid #1E1B14;border-radius:13px;overflow:hidden;
  display:flex;flex-direction:column;min-height:0}
.tv-tarja{display:flex;align-items:center;justify-content:space-between;padding:9px 15px;flex-shrink:0}
.tv-tempo{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tv-estado{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.tv-corpo{padding:13px 15px;display:flex;flex-direction:column;gap:9px;flex-grow:1;min-height:0;overflow:hidden}
.tv-titulo{font-size:21px;font-weight:700;line-height:1.2;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.tv-loja{font-size:16px;color:#8E8B84;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv-todas{color:#6B6A66}
.tv-rodape{display:flex;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.tv-dono{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:700}
.tv-sem-dono{font-size:15px;font-weight:700;color:#fbbf24;background:#271a06;border:1px solid #8A6420;
  border-radius:7px;padding:3px 10px}
.tv-qtd{display:flex;align-items:center;gap:5px;background:#052e16;color:#86efac;border-radius:7px;
  padding:4px 10px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.tv-qtd svg{width:15px;height:15px}
.tv-acao{background:#1E1B14;color:#F4F1EA;border:none;padding:11px;text-align:center;font-size:15px;
  font-weight:800;letter-spacing:.03em;cursor:pointer;flex-shrink:0}
.tv-acao:hover{background:#4A463D}
.tv-acao-fim{background:#8A6420;color:#fff}
.tv-acao-fim:hover{background:var(--brand-dark)}
.tv-vazio{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:#4A463D;font-size:22px;font-weight:700}
.tv-vazio svg{width:54px;height:54px;color:#22c55e}

/* Quantas cada um tem ABERTAS — não quantas concluiu. A primeira ajuda a
   redistribuir; a segunda seria um ranking de desempenho num telão, e disso
   não sai time melhor, sai gente disputando número. */
.tv-carga{display:flex;align-items:center;gap:18px;padding:12px 30px;border-top:1px solid #1E1B14;flex-shrink:0}
.tv-chips{display:flex;gap:9px;flex-wrap:wrap;overflow:hidden}
.tv-chip{display:flex;align-items:center;gap:8px;background:#1E1B14;border-radius:8px;padding:5px 13px;
  font-size:16px;font-weight:700;white-space:nowrap}
.tv-chip b{color:#C9C4B8;font-variant-numeric:tabular-nums}
.tv-chip-pico{background:#2a1215;border:1px solid #7f1d1d}
.tv-chip-pico b{color:#fca5a5}
.tv-resto{margin-left:auto;font-size:16px;color:#8E8B84;flex-shrink:0;white-space:nowrap}

/* Telas menores que a TV: três colunas, depois duas. O cartão encolhe em
   número, nunca em tamanho de letra. */
@media (max-width:1239px){.tv-grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:899px){
  .tv-grade{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tv-numeros{gap:14px}
  .tv-pulso,.tv-excecao,.tv-grade,.tv-carga{padding-left:16px;padding-right:16px}
  .tv-exc-det{display:none}
}

/* O sistema começa OCULTO e só aparece depois que a sessão é confirmada.
   Sem isso, ao abrir sem login, o dashboard piscava por alguns milissegundos
   antes da tela de acesso — expondo a estrutura interna a quem não entrou. */
#sidebar,#main{visibility:hidden}
body.sessao-ativa #sidebar,body.sessao-ativa #main{visibility:visible}
#sidebar{width:210px;background:var(--ink);display:flex;flex-direction:column;padding:18px 10px;flex-shrink:0;overflow-y:auto}
.logo{display:flex;align-items:center;gap:9px;padding:0 6px;margin-bottom:28px}
.logo-img{width:40px;height:40px;border-radius:50%;flex-shrink:0;object-fit:cover}
.logo-text p{margin:0;color:#F4F1EA;font-weight:800;font-size:14px;line-height:1.2}
.logo-text span{color:var(--brand-dark);font-size:9.5px;letter-spacing:.16em}
nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{background:transparent;color:#8E8B84;border:none;border-radius:9px;padding:10px 12px;text-align:left;font-size:13px;display:flex;align-items:center;gap:9px;font-weight:500;transition:all .15s cubic-bezier(.4,0,.2,1);width:100%;position:relative;letter-spacing:-.005em}
.nav-btn:hover{background:rgba(255,255,255,.04);color:#E7E4DD}
.nav-btn.active{background:linear-gradient(90deg,rgba(184,135,43,.20) 0%,rgba(28,26,20,.55) 100%);color:white;font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
.sidebar-footer{margin-top:auto;padding:12px 6px 0;border-top:1px solid #1E1B14;text-align:center;color:#4A463D;font-size:9.5px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:white;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 0 rgba(20,21,26,.02)}
#topbar h1{font-size:16px;font-weight:800;color:#14151A}
.btn-primary{background:var(--ink);color:white;border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:13px;letter-spacing:-.01em;box-shadow:var(--shadow-brand);transition:all .15s cubic-bezier(.4,0,.2,1)}
.btn-primary:hover{background:#000;box-shadow:0 6px 18px rgba(11,11,12,.34);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-sm{background:#F4F1EA;color:#5C584F;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:500;transition:all .15s}
.btn-sm:hover{background:#E7E4DD;color:#14151A}
#content{flex:1;padding:22px;overflow-y:auto}
.card{background:white;border-radius:14px;border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.card-table{background:white;border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:white;border-radius:14px;border:1px solid var(--border);padding:16px 20px;box-shadow:var(--shadow-sm);transition:all .15s}
.stat-label{font-size:11px;color:#6B6A66;font-weight:600;margin-bottom:4px}
.stat-value{font-size:28px;font-weight:800}
.badge{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.b-alta{background:#fee2e2;color:#dc2626}
.b-media{background:#fef3c7;color:#d97706}
.b-baixa{background:#dbeafe;color:#2563eb}
.b-todo{background:#F4F1EA;color:#6B6A66}
.b-doing{background:#F5EBD6;color:#B8872B}
.b-done{background:#dcfce7;color:#16a34a}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.form-panel{background:white;border-radius:14px;border:1px solid var(--brand-200);padding:20px 22px;margin-bottom:20px;box-shadow:0 10px 30px rgba(184,135,43,.08),0 1px 0 rgba(184,135,43,.05);position:relative}
.form-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);border-radius:14px 0 0 14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group label{font-size:11px;color:#6B6A66}
.finput{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;width:100%;color:var(--text);background:white;transition:all .15s;font-family:inherit}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.kanban-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.kanban-col{min-height:60px;border-radius:10px;transition:background .15s}
.kanban-col.drag-over{background:#FBF7EE;outline:2px dashed #E8D4A8;outline-offset:2px}
.task-card{background:white;border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s,opacity .15s}
.task-card:hover{box-shadow:var(--shadow-lg);border-color:#C9C4B8}
.task-card.dragging{opacity:.4}
.task-card .drag-handle{color:#C9C4B8;font-size:13px;cursor:grab;line-height:1.4;padding-top:1px;user-select:none;flex-shrink:0;letter-spacing:-2px}
.task-card .drag-handle:active{cursor:grabbing}
.task-card:hover .drag-handle{color:#8E8B84}
.task-card .card-actions{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .12s}
.task-card:hover .card-actions{opacity:1}
.task-card .card-actions button{background:none;border:none;color:#8E8B84;font-size:13px;padding:1px 4px;cursor:pointer;border-radius:5px;line-height:1}
.task-card .card-actions button:hover{background:#F4F1EA;color:#5C584F}
.task-card .card-actions button.del:hover{background:#fee2e2;color:#dc2626}
.task-card .move-btn{background:#FBFAF7;border:1px solid #E7E4DD;border-radius:6px;padding:4px 8px;font-size:10.5px;color:#5C584F;font-weight:600;width:calc(100% - 18px);margin:9px 0 0 18px;cursor:pointer;transition:all .12s}
.task-card .move-btn:hover{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-dark)}
.task-empty{background:#FBFAF7;border-radius:10px;padding:22px;text-align:center;border:2px dashed #E7E4DD;color:#C9C4B8;font-size:12px}
table{width:100%;border-collapse:collapse}
thead tr{background:#FBFAF7}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:#6B6A66;border-bottom:1px solid #E7E4DD}
td{padding:10px 16px;border-bottom:1px solid #FBFAF7;font-size:13px;color:#14151A;vertical-align:middle}
.card-table tbody tr{transition:background .12s}
.card-table tbody tr:hover{background:#FBFAF7}
tr:last-child td{border-bottom:none}
.filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{border:1px solid #E7E4DD;border-radius:8px;padding:6px 10px;font-size:13px;background:white;color:#14151A}
.prog-track{height:5px;background:#F4F1EA;border-radius:3px}
.prog-bar{height:5px;border-radius:3px}
.chart-group{display:flex;align-items:flex-end;gap:4px;justify-content:space-around;border-bottom:1px solid #F4F1EA;padding-bottom:4px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.chart-bar{width:100%;max-width:28px;border-radius:3px 3px 0 0;min-height:2px}
.chart-lbl{font-size:10px;color:#8E8B84;margin-top:4px;text-align:center}
.meta-tag{font-size:12px;font-weight:800;text-align:center;margin-top:2px;cursor:default}
.legend{display:flex;gap:12px;margin-top:8px;font-size:11px;color:#6B6A66;flex-wrap:wrap}
.ldot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.team-card{background:white;border-radius:12px;padding:16px 18px;border:1px solid #E7E4DD;display:flex;align-items:center;gap:14px}
.urg-head{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px;color:#5C584F}
/* CUSTOM MODALS — shared */
#confirm-mask,#input-mask{position:fixed;inset:0;background:rgba(20,21,26,.55);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .18s ease}
#confirm-mask.show,#input-mask.show{display:flex}
.confirm-box,.input-box{background:white;border-radius:18px;padding:28px 30px;width:420px;max-width:92vw;box-shadow:0 24px 60px rgba(20,21,26,.25),0 2px 0 rgba(255,255,255,.5) inset;animation:popIn .22s cubic-bezier(.16,1,.3,1)}
.confirm-icon{width:48px;height:48px;border-radius:14px;background:var(--brand-50);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--brand-100)}
.confirm-title,.input-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.02em}
.confirm-msg,.input-msg{font-size:13.5px;color:var(--text-muted);line-height:1.55;margin-bottom:22px}
.confirm-msg.access-scroll{max-height:60vh;overflow-y:auto;margin-bottom:16px;padding-right:4px}
.confirm-actions,.input-actions{display:flex;gap:10px;justify-content:flex-end}

/* INPUT MODAL */
.input-icon{width:48px;height:48px;border-radius:14px;background:var(--brand-50);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--brand-100)}
#input-field{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;font-size:14.5px;color:var(--text);background:#FBFAF7;transition:all .15s;font-family:inherit;margin-bottom:4px}
#input-field:focus{background:white}
.input-err{font-size:11.5px;color:#dc2626;margin-top:6px;display:none;font-weight:500}
.input-err.show{display:block}

/* FORM MODAL — used by all edit/create forms */
#form-modal-mask{position:fixed;inset:0;background:rgba(20,21,26,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;z-index:150;padding:40px 20px;overflow-y:auto;animation:fadeIn .2s ease}
#form-modal-mask.show{display:flex}
#form-modal-content{width:100%;max-width:680px;margin:auto;animation:popIn .25s cubic-bezier(.16,1,.3,1)}
#form-modal-content .form-panel{margin-bottom:0;box-shadow:0 30px 70px rgba(20,21,26,.28),0 0 0 1px rgba(184,135,43,.06);max-height:none}

/* TOAST NOTIFICATIONS */
#toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:9px;z-index:500;pointer-events:none;max-width:90vw}
.toast{background:#14151A;color:white;border-radius:11px;padding:13px 18px;font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(20,21,26,.35),0 0 0 1px rgba(255,255,255,.05);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:11px;pointer-events:auto;min-width:280px;letter-spacing:-.005em}
.toast.show{transform:translateX(0);opacity:1}
.toast-icon-wrap{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;color:white}
.toast-success .toast-icon-wrap{background:#16a34a}
.toast-error .toast-icon-wrap{background:#dc2626}
.toast-info .toast-icon-wrap{background:var(--brand)}
.btn-danger{background:#dc2626;color:white;border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:13px;transition:all .15s;box-shadow:0 1px 3px rgba(220,38,38,.25)}
.btn-danger:hover{background:#b91c1c;box-shadow:0 4px 12px rgba(220,38,38,.35);transform:translateY(-1px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

/* RANGE PILLS */
.range-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:20px;background:white;padding:9px 12px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.range-pill{background:transparent;border:none;border-radius:8px;padding:7px 13px;font-size:12.5px;color:#5C584F;font-weight:500;transition:all .15s}
.range-cal{display:inline-flex;align-items:center;gap:6px;margin-left:6px;padding:3px 8px;border-radius:9px;border:1.5px solid #E7E4DD;background:#fff}
.range-cal.active{border-color:#ee4d2d;background:#FBF7EE}
.range-cal input[type=date]{border:none;background:none;font-family:inherit;font-size:12px;color:#14151A;padding:3px 4px;cursor:pointer;color-scheme:light}
.range-cal input[type=date]:focus{outline:none}
.goals-card{background:#fff;border:1.5px solid #E7E4DD;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,32,57,.06)}
.goals-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.goals-head b{font-size:15px;color:#14151A}.goals-head span{font-size:12px;color:#8E8B84;font-weight:600}
.goals-edit{border:1.5px solid #E7E4DD;background:#fff;border-radius:9px;padding:7px 13px;font-family:inherit;font-weight:700;font-size:12px;color:#6B6A66;cursor:pointer}
.goals-edit:hover{border-color:#C9C4B8}
.goals-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.goals-grid{grid-template-columns:1fr}}
.goal-item .goal-name{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8E8B84;margin-bottom:8px}
.goal-prog-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.goal-prog-head b{font-size:22px;font-weight:800}.goal-prog-head span{font-size:11.5px;color:#8E8B84;font-weight:600}
.goal-prog-track{height:8px;border-radius:6px;background:#F4F1EA;overflow:hidden}
.goal-prog-fill{height:100%;border-radius:6px;transition:width .4s ease}
.goal-prog-pct{font-size:11px;font-weight:800;margin-top:5px}
.goals-editbox{display:none;gap:12px;align-items:flex-end;margin-top:16px;padding-top:16px;border-top:1px dashed #E7E4DD;flex-wrap:wrap}
.goals-editbox.open{display:flex}
.goal-in label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#8E8B84;margin-bottom:5px}
.goal-in input{border:1.5px solid #E7E4DD;border-radius:9px;padding:8px 11px;font-family:inherit;font-size:14px;font-weight:700;color:#14151A;width:200px}
.goal-in input:focus{outline:none;border-color:#ee4d2d}
.goal-save{border:none;background:linear-gradient(135deg,#f7941e,#ee4d2d);color:#fff;border-radius:9px;padding:9px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}

/* ---- RELATÓRIO / PDF ---- */
#diag-report{display:none}
#diag-report{color:var(--d-ink);max-width:780px;margin:0 auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-band{background:var(--d-navy);background-image:radial-gradient(circle at 90% 0%,rgba(247,148,30,.5),transparent 48%);color:#fff;border-radius:16px;padding:24px 28px;display:flex;gap:15px;align-items:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-logo{width:50px;height:50px;border-radius:50%;background:var(--d-grad);display:grid;place-items:center;flex:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-logo svg{width:26px;height:26px}
#diag-report .rb{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:#A9B8D4}
#diag-report .r-band h1{font-size:25px;font-weight:800;margin:3px 0 0}
#diag-report .r-mg{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12.5px;margin-top:12px}
#diag-report .r-mg span{color:#A9B8D4;font-weight:600}#diag-report .r-mg b{font-weight:700}
#diag-report .r-score{display:flex;align-items:center;gap:24px;margin:20px 0 6px;padding:20px 24px;border:1.5px solid var(--d-line);border-radius:16px}
#diag-report .r-big{font-weight:800;font-size:62px;line-height:.88}
#diag-report .r-big small{display:block;font-size:11px;color:var(--d-soft);font-weight:700;margin-top:3px}
#diag-report .r-chip{display:inline-block;font-weight:800;font-size:14px;padding:5px 14px;border-radius:30px;margin-top:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-dims{flex:1;display:flex;flex-direction:column;gap:9px}
#diag-report .r-bar .l{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:4px}
#diag-report .r-track{height:8px;background:#EDEFF3;border-radius:6px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-fill{height:100%;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-kpis{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 2px}
#diag-report .r-kpi{border:1.5px solid var(--d-line);border-radius:11px;padding:9px 15px}
#diag-report .r-kpi span{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--d-faint)}
#diag-report .r-kpi b{font-size:18px;color:var(--d-odeep)}
#diag-report h2{font-size:21px;font-weight:800;margin:24px 0 3px}
#diag-report .r-sub{font-size:12.5px;color:var(--d-soft);margin-bottom:14px}
#diag-report .r-task{border:1.5px solid var(--d-line);border-left-width:6px;border-radius:12px;padding:13px 16px;margin-bottom:10px;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-task.alta{border-left-color:var(--d-crit)}#diag-report .r-task.media{border-left-color:var(--d-ruim)}
#diag-report .r-rt{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#diag-report .r-rn{font-weight:800;font-size:14.5px}
#diag-report .r-rd{font-size:10px;color:var(--d-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
#diag-report .r-rp{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:30px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .r-rp.alta{background:var(--d-critbg);color:var(--d-crit)}#diag-report .r-rp.media{background:var(--d-ruimbg);color:var(--d-ruim)}
#diag-report .r-action{font-size:13px;margin-top:8px;line-height:1.45;color:#333A4D}#diag-report .r-action b{color:var(--d-odeep)}
#diag-report .r-ok{border:1.5px dashed var(--d-otimo);background:var(--d-otimobg);color:#0F6B3A;border-radius:13px;padding:20px;text-align:center;font-size:14px;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* Detalhamento das notas e lista de problemas no relatório do cliente */
#diag-report .rd-sec{font-size:13px;font-weight:800;color:var(--d-ink);margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--d-o2);letter-spacing:-.01em}
#diag-report .rd-block{border:1.5px solid var(--d-line);border-radius:12px;padding:12px 14px;margin-bottom:10px;page-break-inside:avoid}
#diag-report .rd-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12.5px}
#diag-report .rd-h b{color:var(--d-ink)}
#diag-report .rd-h span{font-size:10.5px;color:var(--d-soft)}
#diag-report .rd-t{width:100%;border-collapse:collapse;font-size:11.5px}
#diag-report .rd-t td{padding:5px 0;border-top:1px solid #FBFAF7;vertical-align:top}
#diag-report .rd-t tr:first-child td{border-top:0}
#diag-report .rd-n{color:var(--d-ink)}
#diag-report .rd-n small{display:block;color:var(--d-soft);font-size:10px;margin-top:1px}
#diag-report .rd-s{text-align:right;white-space:nowrap;width:1%}
#diag-report .rd-tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .rd-leg{font-size:10.5px;color:var(--d-soft);line-height:1.65;background:#FBFAF7;border:1px solid var(--d-line);border-radius:10px;padding:10px 12px;margin-top:4px}
#diag-report .rd-leg b{color:var(--d-ink)}
#diag-report .rd-plan{margin-top:2px}
/* Lista de problemas — didática e impressa com cor fiel */
#diag-report .rp-resumo{font-size:11.5px;line-height:1.7;color:var(--d-soft);background:#FBFAF7;border:1px solid var(--d-line);border-left:4px solid var(--d-o2);border-radius:10px;padding:11px 14px;margin-bottom:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .rp-resumo b{color:var(--d-ink)}
#diag-report .rp-item{border:1.5px solid var(--d-line);border-left-width:5px;border-radius:12px;padding:12px 15px;margin-bottom:11px;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .rp-item.alta{border-left-color:var(--d-crit);background:#FFFCFC}
#diag-report .rp-item.media{border-left-color:var(--d-ruim);background:#FFFDF8}
#diag-report .rp-top{display:flex;align-items:flex-start;gap:10px}
#diag-report .rp-num{width:21px;height:21px;border-radius:6px;background:var(--d-ink);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .rp-ti{flex:1;min-width:0}
#diag-report .rp-nome{font-size:13px;font-weight:800;color:var(--d-ink);letter-spacing:-.01em}
#diag-report .rp-dim{font-size:10px;color:var(--d-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
#diag-report .rp-sit{font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.03em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#diag-report .rp-sit.alta{background:#FCE7E7;color:var(--d-crit)}
#diag-report .rp-sit.media{background:#FDF0DC;color:#A8690B}
#diag-report .rp-exp{font-size:11.5px;line-height:1.65;color:#3F4A5A;margin-top:8px;padding-left:31px}
#diag-report .rp-med{font-size:10.5px;color:var(--d-soft);margin-top:6px;padding-left:31px}
#diag-report .rp-med b{color:var(--d-ink)}
#diag-report .r-foot{margin-top:26px;border-top:2px solid var(--d-o2);padding-top:12px;font-size:11px;color:var(--d-soft);display:flex;justify-content:space-between}#diag-report .r-foot b{color:var(--d-ink)}
/* margin:0 na página faz o Chrome suprimir o cabeçalho/rodapé automático
   (URL do site e "1/2"). A margem visual vem do padding do relatório. */
@media print{ body>*{display:none!important} #diag-report{display:block!important;padding:11mm} @page{margin:0} }
</style>

<!-- custos.js é MÓDULO, não script clássico: o mesmo arquivo é importado pelos
     testes em node. Assim a regra de cruzar venda com custo existe uma vez só.
     Módulo carrega adiado, então o resto do código usa window.custos com
     guarda — na prática ele já está pronto quando alguém faz login. -->
<script type="module">
  import * as custos from "./js/custos.js?v=0b61a8ef";
  import * as planilha from "./js/planilha-produtos.js?v=21e09942";
  import * as prazos from "./js/prazos.js?v=b89b4b18";
  import * as ficha from "./js/ficha-produto.js?v=d305bfd7";
  import * as taxas from "./js/taxas.js?v=3a1cac10";
  import * as drive from "./js/drive.js?v=64e57ef6";
  window.custos = custos;
  window.planilha = planilha;
  window.prazos = prazos;
  window.ficha = ficha;
  window.taxas = taxas;
  window.drive = drive;
</script>
