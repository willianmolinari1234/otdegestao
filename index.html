.logo-text p{margin:0;color:#f1f5f9;font-weight:800;font-size:14px;line-height:1.2}
.logo-text span{color:#334155;font-size:9.5px}
nav{display:flex;flex-direction:column;gap:2px}
.nav-btn{background:transparent;color:#94a3b8;border:none;border-radius:9px;padding:10px 12px;text-align:left;font-size:13px;display:flex;align-items:center;gap:9px;font-weight:500;transition:all .15s cubic-bezier(.4,0,.2,1);width:100%;position:relative;letter-spacing:-.005em}
.nav-btn:hover{background:rgba(255,255,255,.04);color:#e2e8f0}
.nav-btn.active{background:linear-gradient(90deg,rgba(234,88,12,.18) 0%,rgba(30,41,59,.5) 100%);color:white;font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
.sidebar-footer{margin-top:auto;padding:12px 6px 0;border-top:1px solid #1e293b;text-align:center;color:#334155;font-size:9.5px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:white;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 0 rgba(15,23,42,.02)}
#topbar h1{font-size:16px;font-weight:800;color:#0f172a}
.btn-primary{background:var(--brand);color:white;border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:13px;letter-spacing:-.01em;box-shadow:var(--shadow-brand);transition:all .15s cubic-bezier(.4,0,.2,1)}
.btn-primary:hover{background:var(--brand-dark);box-shadow:0 6px 18px rgba(234,88,12,.4);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-sm{background:#f1f5f9;color:#475569;border:none;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:500;transition:all .15s}
.btn-sm:hover{background:#e2e8f0;color:#0f172a}
#content{flex:1;padding:22px;overflow-y:auto}
.card{background:white;border-radius:14px;border:1px solid var(--border);padding:18px 20px;box-shadow:var(--shadow-sm);transition:box-shadow .15s}
.card-table{background:white;border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-sm)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:white;border-radius:14px;border:1px solid var(--border);padding:16px 20px;box-shadow:var(--shadow-sm);transition:all .15s}
.stat-label{font-size:11px;color:#64748b;font-weight:600;margin-bottom:4px}
.stat-value{font-size:28px;font-weight:800}
.badge{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.b-alta{background:#fee2e2;color:#dc2626}
.b-media{background:#fef3c7;color:#d97706}
.b-baixa{background:#dbeafe;color:#2563eb}
.b-todo{background:#f1f5f9;color:#64748b}
.b-doing{background:#ffedd5;color:#ea580c}
.b-done{background:#dcfce7;color:#16a34a}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.form-panel{background:white;border-radius:14px;border:1px solid var(--brand-200);padding:20px 22px;margin-bottom:20px;box-shadow:0 10px 30px rgba(234,88,12,.08),0 1px 0 rgba(234,88,12,.05);position:relative}
.form-panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);border-radius:14px 0 0 14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-group{display:flex;flex-direction:column;gap:3px}
.form-group label{font-size:11px;color:#64748b}
.finput{border:1px solid var(--border);border-radius:9px;padding:9px 12px;font-size:13px;width:100%;color:var(--text);background:white;transition:all .15s;font-family:inherit}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.kanban-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.kanban-col{min-height:60px;border-radius:10px;transition:background .15s}
.kanban-col.drag-over{background:#fff7ed;outline:2px dashed #fed7aa;outline-offset:2px}
.task-card{background:white;border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,border-color .15s,opacity .15s}
.task-card:hover{box-shadow:var(--shadow-lg);border-color:#cbd5e1}
.task-card.dragging{opacity:.4}
.task-card .drag-handle{color:#cbd5e1;font-size:13px;cursor:grab;line-height:1.4;padding-top:1px;user-select:none;flex-shrink:0;letter-spacing:-2px}
.task-card .drag-handle:active{cursor:grabbing}
.task-card:hover .drag-handle{color:#94a3b8}
.task-card .card-actions{display:flex;gap:1px;flex-shrink:0;opacity:0;transition:opacity .12s}
.task-card:hover .card-actions{opacity:1}
.task-card .card-actions button{background:none;border:none;color:#94a3b8;font-size:13px;padding:1px 4px;cursor:pointer;border-radius:5px;line-height:1}
.task-card .card-actions button:hover{background:#f1f5f9;color:#475569}
.task-card .card-actions button.del:hover{background:#fee2e2;color:#dc2626}
.task-card .move-btn{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:4px 8px;font-size:10.5px;color:#475569;font-weight:600;width:calc(100% - 18px);margin:9px 0 0 18px;cursor:pointer;transition:all .12s}
.task-card .move-btn:hover{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-dark)}
.task-empty{background:#f8fafc;border-radius:10px;padding:22px;text-align:center;border:2px dashed #e2e8f0;color:#cbd5e1;font-size:12px}
table{width:100%;border-collapse:collapse}
thead tr{background:#f8fafc}
th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:#64748b;border-bottom:1px solid #e2e8f0}
td{padding:10px 16px;border-bottom:1px solid #f8fafc;font-size:13px;color:#0f172a;vertical-align:middle}
.card-table tbody tr{transition:background .12s}
.card-table tbody tr:hover{background:#fafbfc}
tr:last-child td{border-bottom:none}
.filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:13px;background:white;color:#0f172a}
.prog-track{height:5px;background:#f1f5f9;border-radius:3px}
.prog-bar{height:5px;border-radius:3px}
.chart-group{display:flex;align-items:flex-end;gap:4px;justify-content:space-around;border-bottom:1px solid #f1f5f9;padding-bottom:4px}
.chart-col{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.chart-bar{width:100%;max-width:28px;border-radius:3px 3px 0 0;min-height:2px}
.chart-lbl{font-size:10px;color:#94a3b8;margin-top:4px;text-align:center}
.meta-tag{font-size:12px;font-weight:800;text-align:center;margin-top:2px;cursor:default}
.legend{display:flex;gap:12px;margin-top:8px;font-size:11px;color:#64748b;flex-wrap:wrap}
.ldot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
.team-card{background:white;border-radius:12px;padding:16px 18px;border:1px solid #e2e8f0;display:flex;align-items:center;gap:14px}
.urg-head{display:flex;justify-content:space-between;margin-bottom:3px;font-size:12px;color:#475569}
/* CUSTOM MODALS — shared */
#confirm-mask,#input-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .18s ease}
#confirm-mask.show,#input-mask.show{display:flex}
.confirm-box,.input-box{background:white;border-radius:18px;padding:28px 30px;width:420px;max-width:92vw;box-shadow:0 24px 60px rgba(15,23,42,.25),0 2px 0 rgba(255,255,255,.5) inset;animation:popIn .22s cubic-bezier(.16,1,.3,1)}
.confirm-icon{width:48px;height:48px;border-radius:14px;background:var(--brand-50);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--brand-100)}
.confirm-title,.input-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:6px;letter-spacing:-.02em}
.confirm-msg,.input-msg{font-size:13.5px;color:var(--text-muted);line-height:1.55;margin-bottom:22px}
.confirm-msg.access-scroll{max-height:60vh;overflow-y:auto;margin-bottom:16px;padding-right:4px}
.confirm-actions,.input-actions{display:flex;gap:10px;justify-content:flex-end}

/* INPUT MODAL */
.input-icon{width:48px;height:48px;border-radius:14px;background:var(--brand-50);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;box-shadow:inset 0 0 0 1px var(--brand-100)}
#input-field{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;font-size:14.5px;color:var(--text);background:#fafbfc;transition:all .15s;font-family:inherit;margin-bottom:4px}
#input-field:focus{background:white}
.input-err{font-size:11.5px;color:#dc2626;margin-top:6px;display:none;font-weight:500}
.input-err.show{display:block}

/* FORM MODAL — used by all edit/create forms */
#form-modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-start;justify-content:center;z-index:150;padding:40px 20px;overflow-y:auto;animation:fadeIn .2s ease}
#form-modal-mask.show{display:flex}
#form-modal-content{width:100%;max-width:680px;margin:auto;animation:popIn .25s cubic-bezier(.16,1,.3,1)}
#form-modal-content .form-panel{margin-bottom:0;box-shadow:0 30px 70px rgba(15,23,42,.28),0 0 0 1px rgba(234,88,12,.06);max-height:none}

/* TOAST NOTIFICATIONS */
#toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:9px;z-index:500;pointer-events:none;max-width:90vw}
.toast{background:#0f172a;color:white;border-radius:11px;padding:13px 18px;font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(15,23,42,.35),0 0 0 1px rgba(255,255,255,.05);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:11px;pointer-events:auto;min-width:280px;letter-spacing:-.005em}
.toast.show{transform:translateX(0);opacity:1}
.toast-icon-wrap{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;color:white}
.toast-success .toast-icon-wrap{background:#16a34a}
.toast-error .toast-icon-wrap{background:#dc2626}
.toast-info .toast-icon-wrap{background:var(--brand)}
.btn-danger{background:#dc2626;color:white;border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:13px;transition:all .15s;box-shadow:0 1px 3px rgba(220,38,38,.25)}
.btn-danger:hover{background:#b91c1c;box-shadow:0 4px 12px rgba(220,38,38,.35);transform:translateY(-1px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

/* RANGE PILLS */
.range-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:20px;background:white;padding:9px 12px;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.range-pill{background:transparent;border:none;border-radius:8px;padding:7px 13px;font-size:12.5px;color:#475569;font-weight:500;transition:all .15s}
.range-cal{display:inline-flex;align-items:center;gap:6px;margin-left:6px;padding:3px 8px;border-radius:9px;border:1.5px solid #e2e8f0;background:#fff}
.range-cal.active{border-color:#ee4d2d;background:#fff7ed}
.range-cal input[type=date]{border:none;background:none;font-family:inherit;font-size:12px;color:#0f172a;padding:3px 4px;cursor:pointer;color-scheme:light}
.range-cal input[type=date]:focus{outline:none}
.goals-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,32,57,.06)}
.goals-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.goals-head b{font-size:15px;color:#0f172a}.goals-head span{font-size:12px;color:#94a3b8;font-weight:600}
.goals-edit{border:1.5px solid #e2e8f0;background:#fff;border-radius:9px;padding:7px 13px;font-family:inherit;font-weight:700;font-size:12px;color:#64748b;cursor:pointer}
.goals-edit:hover{border-color:#cbd5e1}
.goals-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.goals-grid{grid-template-columns:1fr}}
.goal-item .goal-name{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;margin-bottom:8px}
.goal-prog-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.goal-prog-head b{font-size:22px;font-weight:800}.goal-prog-head span{font-size:11.5px;color:#94a3b8;font-weight:600}
.goal-prog-track{height:8px;border-radius:6px;background:#f1f5f9;overflow:hidden}
.goal-prog-fill{height:100%;border-radius:6px;transition:width .4s ease}
.goal-prog-pct{font-size:11px;font-weight:800;margin-top:5px}
.goals-editbox{display:none;gap:12px;align-items:flex-end;margin-top:16px;padding-top:16px;border-top:1px dashed #e2e8f0;flex-wrap:wrap}
.goals-editbox.open{display:flex}
.goal-in label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;margin-bottom:5px}
.goal-in input{border:1.5px solid #e2e8f0;border-radius:9px;padding:8px 11px;font-family:inherit;font-size:14px;font-weight:700;color:#0f172a;width:200px}
.goal-in input:focus{outline:none;border-color:#ee4d2d}
.goal-save{border:none;background:linear-gradient(135deg,#f7941e,#ee4d2d);color:#fff;border-radius:9px;padding:9px 18px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.range-pill:hover{background:var(--brand-50);color:var(--brand-tint)}
.range-pill.active{background:var(--brand);color:white;font-weight:700;box-shadow:0 2px 6px rgba(234,88,12,.3)}
.range-sep{width:1px;height:18px;background:#e2e8f0;margin:0 4px}
.range-date{border:1px solid #e2e8f0;border-radius:7px;padding:5px 8px;font-size:12.5px;color:#0f172a;background:white}

/* DEADLINE BADGE */
.deadline{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:4px}
.task-card.overdue{border-left-color:#dc2626!important;background:#fff5f5}

/* TASK TEMPLATES */
.templates{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;padding:10px;background:#fff7ed;border-radius:8px;border:1px dashed #fed7aa}
.tpl-btn{background:white;border:1px solid #fed7aa;border-radius:6px;padding:5px 10px;font-size:11.5px;color:#9a3412;font-weight:500;cursor:pointer;transition:all .1s}
.tpl-btn:hover{background:#ea580c;color:white;border-color:#ea580c}
.tpl-label{font-size:10.5px;color:#9a3412;font-weight:700;width:100%;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

/* RENEW PRESET BUTTONS */
.rn-preset{background:white;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:12.5px;color:#475569;font-weight:600;cursor:pointer;transition:all .15s}
.rn-preset:hover{border-color:var(--brand);color:var(--brand)}
.rn-preset.active{background:var(--brand);color:white;border-color:var(--brand);box-shadow:0 2px 6px rgba(234,88,12,.3)}

/* SECONDARY ACTION BUTTONS */
.btn-outline{background:white;color:var(--brand);border:1px solid var(--brand-200);border-radius:9px;padding:8px 14px;font-weight:600;font-size:12.5px;transition:all .15s}
.btn-outline:hover{background:var(--brand-50);border-color:var(--brand)}


/* SEARCHABLE SELECT — combobox with type-to-filter */
.ss-wrap{position:relative;display:block;width:100%}
.filter-bar .ss-wrap{flex:0 1 auto;min-width:180px;max-width:240px;display:inline-block}
.ss-input{cursor:pointer;background:white;padding-right:30px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.filter-bar .ss-input{border:1px solid #e2e8f0;border-radius:8px;padding:6px 28px 6px 10px;font-size:13px;width:100%;background:white;color:#0f172a}
.ss-input:not([readonly]){background:white}
.ss-chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:10px;pointer-events:none;transition:transform .15s}
.ss-wrap.is-open .ss-chev{transform:translateY(-50%) rotate(180deg);color:var(--brand)}
.ss-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:white;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);max-height:260px;overflow-y:auto;z-index:160;padding:4px}
.ss-list[hidden]{display:none}
.ss-opt{padding:8px 12px;font-size:13px;color:var(--text);border-radius:7px;cursor:pointer;transition:background .1s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss-opt:hover,.ss-opt.is-active{background:var(--brand-50);color:var(--brand-tint)}
.ss-opt.is-selected{background:var(--brand);color:white;font-weight:600}
.ss-opt.is-selected:hover,.ss-opt.is-selected.is-active{background:var(--brand-dark);color:white}
.ss-empty{padding:14px 12px;font-size:12.5px;color:#94a3b8;text-align:center;font-style:italic}

/* AUTH SCREEN */
#auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
#auth-screen.show{display:flex}
.auth-box{background:white;border-radius:18px;padding:36px 40px;width:420px;max-width:95vw;box-shadow:0 20px 60px #ea580c25}
.auth-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:28px}
.auth-logo img{width:88px;height:88px;border-radius:50%;box-shadow:0 4px 20px #ea580c55;margin-bottom:12px}
.auth-logo h2{font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.5px;margin-bottom:2px}
.auth-logo span{font-size:12px;color:#64748b}
.auth-title{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:4px;text-align:center}
.auth-sub{font-size:12.5px;color:#64748b;margin-bottom:22px;text-align:center;line-height:1.5}
.auth-input{width:100%;border:1px solid #e2e8f0;border-radius:9px;padding:11px 14px;font-size:14px;margin-bottom:10px;background:#fafafa}
.auth-input:focus{background:white;border-color:#ea580c!important;box-shadow:0 0 0 3px #ea580c20!important}
.auth-btn{width:100%;background:#ea580c;color:white;border:none;border-radius:9px;padding:12px;font-weight:700;font-size:14px;margin-top:6px}
.auth-btn:hover{background:#c2410c}
.auth-err{background:#fee2e2;color:#991b1b;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:10px;display:none}
.auth-err.show{display:block}
.auth-foot{text-align:center;color:#94a3b8;font-size:11px;margin-top:18px}

/* SYNC INDICATOR */
.sync-dot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#16a34a;font-weight:600;padding:4px 10px;background:#dcfce7;border-radius:20px;border:1px solid #bbf7d0}
.sync-dot.offline{color:#dc2626;background:#fee2e2;border-color:#fecaca}
.sync-dot.loading{color:#d97706;background:#fef3c7;border-color:#fde68a}
.sync-dot .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* USER MENU IN TOPBAR */
.user-chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;background:#fff7ed;border-radius:20px;border:1px solid #fed7aa}
.user-chip-name{font-size:12.5px;font-weight:600;color:#9a3412}
.user-chip-role{font-size:9.5px;color:#c2410c;background:#fed7aa;padding:1px 6px;border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.logout-btn{background:transparent;border:none;color:#64748b;font-size:13px;padding:4px 8px;cursor:pointer}
.logout-btn:hover{color:#dc2626}

/* PROMO CARDS */
.promo-card{background:white;border-radius:11px;border:1px solid #e2e8f0;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;border-left:4px solid #94a3b8;transition:all .15s}
.promo-card:hover{box-shadow:0 4px 14px #00000010}
.promo-card.urg-red{border-left-color:#dc2626;background:#fff5f5}
.promo-card.urg-orange{border-left-color:#ea580c;background:#fff7ed}
.promo-card.urg-amber{border-left-color:#d97706;background:#fffbeb}
.promo-card.urg-green{border-left-color:#16a34a}
.promo-card.expired{border-left-color:#94a3b8;background:#f8fafc;opacity:.7}
.promo-time{min-width:110px;text-align:center;padding:8px 6px;border-radius:8px;font-weight:800}
.promo-time-big{font-size:22px;line-height:1}

#plwrap .pl-title{font-weight:800;font-size:19px;letter-spacing:-.01em}
#plwrap .pl-title small{display:block;font-size:12px;font-weight:600;color:var(--p-soft);margin-top:1px}
#plwrap .pl-cfgbtn{border:1.5px solid var(--p-line);background:#fff;border-radius:11px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:13px;color:var(--p-soft);cursor:pointer}
#plwrap .pl-cfgbtn:hover{border-color:var(--p-faint)}
#plwrap .pl-new{border:none;background:var(--p-grad);color:#fff;border-radius:11px;padding:10px 18px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 8px 20px rgba(238,77,45,.32)}
#plwrap .pl-new:hover{filter:brightness(1.05)}
/* ---- CONFIG ---- */
#plwrap .pl-cfg{display:none;background:#fff;border:1.5px solid var(--p-line);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--p-sh)}
#plwrap .pl-cfg.open{display:block}
#plwrap .pl-cfgrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
#plwrap .pl-cfgin label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--p-faint);margin-bottom:5px}
#plwrap .pl-cfgin input{width:100%;border:1.5px solid var(--p-line);border-radius:9px;padding:8px 10px;font-family:inherit;font-weight:700;font-size:14px;color:var(--p-ink)}
#plwrap .pl-cfgin input:focus{outline:none;border-color:var(--p-o2)}
#plwrap .pl-tiers{margin-top:14px;border-top:1px dashed var(--p-line);padding-top:12px}
#plwrap .pl-tiers .tt{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--p-faint);margin-bottom:8px}
#plwrap .pl-tierrow{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--p-lsoft);max-width:420px}
#plwrap .pl-tierrow span{color:var(--p-soft)}#plwrap .pl-tierrow b{font-variant-numeric:tabular-nums}
#plwrap .pl-cfgnote{font-size:12px;color:var(--p-soft);margin-top:12px;line-height:1.5}
/* ---- RESUMO + TABELA ---- */
#plwrap .pl-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
#plwrap .pl-card{background:#fff;border:1.5px solid var(--p-line);border-radius:14px;padding:14px 16px;box-shadow:var(--p-sh)}
#plwrap .pl-card span{display:block;font-size:11.5px;font-weight:700;color:var(--p-faint);text-transform:uppercase;letter-spacing:.04em}
#plwrap .pl-card b{font-size:24px;font-weight:800}
#plwrap .pl-card.warn{border-color:#FCD9D9;background:#FFF6F6}#plwrap .pl-card.warn b{color:var(--p-red)}
#plwrap .pl-empty{padding:46px 16px;text-align:center;color:var(--p-soft);font-size:14px;background:#fff;border:1.5px dashed var(--p-line);border-radius:16px}
#plwrap .pl-tablewrap{background:#fff;border:1.5px solid var(--p-line);border-radius:16px;overflow:hidden;box-shadow:var(--p-sh)}
#plwrap .pl-table{width:100%;border-collapse:collapse;font-size:13.5px}
#plwrap .pl-table thead th{text-align:left;padding:12px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--p-faint);border-bottom:1.5px solid var(--p-line);background:#FBFBFC}
#plwrap .pl-table thead th:nth-child(n+4){text-align:right}
#plwrap .pl-table thead th:nth-child(8),#plwrap .pl-table thead th:last-child{text-align:center}
#plwrap .pl-row td{padding:11px 14px;border-bottom:1px solid var(--p-lsoft);vertical-align:middle}
#plwrap .pl-row:hover td{background:#FCFCFD}
#plwrap .pl-tog{border:none;background:none;color:var(--p-faint);cursor:pointer;font-size:13px;transition:.15s}
#plwrap .pl-tog.open{transform:rotate(90deg);color:var(--p-o2)}
#plwrap .pl-sku{color:var(--p-soft);font-weight:600}
#plwrap .pl-name{font-weight:700}
#plwrap .pl-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#plwrap .pl-fee{font-size:11px;color:var(--p-faint);font-weight:700}
#plwrap td.pl-act{text-align:center;white-space:nowrap}
#plwrap .pl-act button{border:none;background:none;cursor:pointer;font-size:14px;color:var(--p-faint);padding:3px 6px}
#plwrap .pl-act button:hover{color:var(--p-o2)}
#plwrap .pl-detail{display:none}#plwrap .pl-detail.open{display:table-row}
#plwrap .pl-detail td{padding:0 14px 14px 14px;background:#FBFBFC;border-bottom:1px solid var(--p-lsoft)}
#plwrap .pl-break{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 22px;padding:12px 0 4px;font-size:12.5px}
#plwrap .pl-break div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--p-lsoft)}
#plwrap .pl-break span{color:var(--p-soft)}#plwrap .pl-break b{font-variant-numeric:tabular-nums}
#plwrap .pl-break .pl-tot{border-bottom:none;font-weight:800}#plwrap .pl-break .pl-tot span{color:var(--p-ink);font-weight:800}
#plwrap .pl-extra{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px;font-size:12px;color:var(--p-soft)}
#plwrap .pl-extra a{color:var(--p-odeep);font-weight:700;text-decoration:none}#plwrap .pl-extra a:hover{text-decoration:underline}
/* ---- MODAL ---- */
#pl-modal{position:fixed;inset:0;background:rgba(20,32,57,.45);display:none;align-items:center;justify-content:center;z-index:900;padding:20px}
#pl-modal .pl-modal{background:#fff;border-radius:18px;max-width:580px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 70px rgba(20,32,57,.3)}
#pl-modal .pl-mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--p-lsoft);position:sticky;top:0;background:#fff;z-index:1}
#pl-modal .pl-mh b{font-size:17px;font-weight:800}
#pl-modal .pl-mh button{border:none;background:none;font-size:18px;color:var(--p-faint);cursor:pointer}
#pl-modal .pl-mbody{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
#pl-modal .pl-frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#pl-modal .pl-fg label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--p-faint);margin-bottom:5px}
#pl-modal .pl-fg input,#pl-modal .pl-fg textarea,#pl-modal .pl-fg select{width:100%;border:1.5px solid var(--p-line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;color:var(--p-ink)}
#pl-modal .pl-fg input:focus,#pl-modal .pl-fg textarea:focus,#pl-modal .pl-fg select:focus{outline:none;border-color:var(--p-o2);box-shadow:0 0 0 3px rgba(238,77,45,.12)}
#pl-modal .pl-fg textarea{resize:vertical}
#pl-modal .pl-feehint{font-size:12px;font-weight:700;color:var(--p-odeep);background:#FCEADF;border-radius:9px;padding:8px 12px}
#pl-modal .pl-prev{display:flex;gap:24px;background:var(--p-navy);color:#fff;border-radius:12px;padding:12px 18px;background-image:radial-gradient(circle at 90% 0%,rgba(247,148,30,.4),transparent 60%)}
#pl-modal .pl-prev div span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9FB0CC}
#pl-modal .pl-prev div b{font-size:22px;font-weight:800}
#pl-modal .pl-hist{border:1.5px solid var(--p-line);border-radius:10px;padding:10px 12px;background:#FBFBFC}
#pl-modal .pl-hrow{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--p-lsoft)}
#pl-modal .pl-hrow:last-of-type{border-bottom:none}
#pl-modal .pl-hrow span{color:var(--p-soft);font-weight:600}
#pl-modal .pl-hrow b{font-variant-numeric:tabular-nums;color:var(--p-odeep)}
#pl-modal .pl-hempty{font-size:12px;color:var(--p-faint);font-style:italic}
#pl-modal .pl-haddrow{display:flex;gap:8px;margin-top:10px}
#pl-modal .pl-haddrow input{flex:1;border:1.5px solid var(--p-line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--p-ink)}
#pl-modal .pl-haddrow input:focus{outline:none;border-color:var(--p-o2);box-shadow:0 0 0 3px rgba(238,77,45,.12)}
#pl-modal .pl-haddrow button{border:none;background:var(--p-navy);color:#fff;border-radius:9px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
#pl-modal .pl-haddrow button:hover{filter:brightness(1.15)}
#pl-modal .pl-hnote{font-size:11px;color:var(--p-faint);margin-top:8px;line-height:1.45}
#pl-modal .pl-varrow{display:grid;grid-template-columns:1.6fr 1fr 1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
#pl-modal .pl-varrow input{border:1.5px solid var(--p-line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--p-ink);width:100%}
#pl-modal .pl-varrow input:focus{outline:none;border-color:var(--p-o2);box-shadow:0 0 0 3px rgba(238,77,45,.10)}
#pl-modal .pv-m{font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;background:#F0F1F5;color:#9AA1AE;min-width:58px;text-align:center}
#pl-modal .pv-del{border:none;background:none;color:var(--p-faint);cursor:pointer;font-size:14px;padding:2px 4px}
#pl-modal .pv-del:hover{color:#E03B3B}
#pl-modal .pl-varadd{border:1.5px dashed var(--p-line);background:#fff;color:var(--p-soft);border-radius:9px;padding:8px 14px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;width:100%}
#pl-modal .pl-varadd:hover{border-color:var(--p-o2);color:var(--p-odeep)}
#plwrap .pl-vartable{width:100%;border-collapse:collapse;font-size:12.5px;margin:10px 0;max-width:680px}
#plwrap .pl-vartable th{text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--p-faint);padding:6px 8px;border-bottom:1px solid var(--p-line)}
#plwrap .pl-vartable td{padding:6px 8px;border-bottom:1px dashed var(--p-lsoft);font-variant-numeric:tabular-nums}
#plwrap .pl-varname{font-weight:700}
#plwrap .pl-name small{display:block;font-weight:600;color:var(--p-faint);font-size:11px;margin-top:1px}
#plwrap .pl-chart,#pl-modal .pl-chart{background:#fff;border:1.5px solid var(--p-line);border-radius:12px;padding:12px 14px 8px;margin:10px 0;max-width:600px}
#pl-modal .pl-chart{border-style:dashed;margin:0 0 10px}
#plwrap .pl-chart-t,#pl-modal .pl-chart-t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--p-faint);margin-bottom:6px}
#pl-modal .pl-mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--p-lsoft);position:sticky;bottom:0;background:#fff}
#pl-modal .pl-cancel{border:1.5px solid var(--p-line);background:#fff;color:var(--p-soft);border-radius:11px;padding:10px 18px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
#pl-modal .pl-save{border:none;background:var(--p-grad);color:#fff;border-radius:11px;padding:10px 22px;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
</style>
</head>

// ─── REAL-TIME LISTENERS ──────────────────────────────────────────────
let listeners=[];
function startListeners(){
  stopListeners();
  setSyncStatus("loading","Sincronizando...");
  let loaded=0;
  const total=5;
  const _done={};
  const onLoaded=()=>{loaded++;if(loaded>=total){setSyncStatus("online","Online");render();}};
  // Marca um listener do caminho crítico como concluído no máximo 1 vez,
  // seja por sucesso ou por erro (ex.: regra do Firestore negou a leitura).
  // Assim uma coleção negada não trava o boot em "Carregando...".
  const critDone=(key)=>{if(!_done[key]){_done[key]=true;if(loaded<total)onLoaded();}};
  if(isAdmin()){
    listeners.push(window.fb.onSnapshot(window.fb.collection(window.fb.db,"employees"),snap=>{
      emps=snap.docs.map(d=>d.data());
      // Refresh currentUser if our doc changed
      if(currentUser){const me=emps.find(e=>e.id===currentUser.id);if(me)currentUser=me;}
      if(_done.emps)render();else critDone("emps");
    },err=>{console.error("emps listener:",err);critDone("emps");}));
  }else{
    // Funcionário comum só pode ler o próprio cadastro (regra do Firestore).
    // Usa o currentUser já carregado no boot como a lista de "emps".
    emps=currentUser?[currentUser]:[];
    critDone("emps");
  }
  listeners.push(window.fb.onSnapshot(window.fb.collection(window.fb.db,"customers"),snap=>{
    custs=snap.docs.map(d=>d.data());
    if(_done.custs)render();else critDone("custs");
  },err=>{console.error("custs listener:",err);custs=[];critDone("custs");}));
  listeners.push(window.fb.onSnapshot(window.fb.collection(window.fb.db,"clients"),snap=>{
    clis=snap.docs.map(d=>d.data());
    if(_done.clis)render();else critDone("clis");
  },err=>{console.error("clis listener:",err);clis=[];critDone("clis");}));
  const tasksRef=isAdmin()?window.fb.collection(window.fb.db,"tasks")
    :window.fb.query(window.fb.collection(window.fb.db,"tasks"),window.fb.where("emp","==",currentUser.id));
  listeners.push(window.fb.onSnapshot(tasksRef,snap=>{
    tsks=snap.docs.map(d=>d.data());
    if(_done.tsks)render();else critDone("tsks");
  },err=>{console.error("tsks listener:",err);tsks=[];critDone("tsks");}));
  const promsRef=isAdmin()?window.fb.collection(window.fb.db,"promos")
    :window.fb.query(window.fb.collection(window.fb.db,"promos"),window.fb.where("emp","==",currentUser.id));
  listeners.push(window.fb.onSnapshot(promsRef,snap=>{
    proms=snap.docs.map(d=>d.data());
    if(_done.proms)render();else critDone("proms");
  },err=>{console.error("proms listener:",err);proms=[];critDone("proms");}));
  if(isAdmin()){
    listeners.push(window.fb.onSnapshot(window.fb.collection(window.fb.db,"products"),snap=>{
      const all=snap.docs.map(d=>d.data());
      const cfg=all.find(d=>d.id==="_config");
      prodCfg=Object.assign({imposto:7.5,gestao:2,meta:15},cfg||{});
      prods=all.filter(d=>d.id!=="_config");
      if(currentUser)render();
    },err=>console.error("prods listener:",err)));
  }
  listeners.push(window.fb.onSnapshot(window.fb.collection(window.fb.db,"config"),snap=>{
    const g=snap.docs.map(d=>d.data()).find(d=>d.id==="repgoals");
    if(g)repGoals=Object.assign({adsPerDay:0,conclusao:0},g);
    if(currentUser)render();
  },err=>console.error("config listener:",err)));
}
function stopListeners(){listeners.forEach(unsub=>{try{unsub();}catch{}});listeners=[];}

// ─── DATE RANGE / DEADLINE HELPERS ────────────────────────────────────
function inRange(taskDate){
  if(fRange==="all")return true;
  if(fRange==="custom")return taskDate===fDate;
  if(fRange==="today")return taskDate===todayISO();
  const t=new Date(todayISO()),d=new Date(taskDate);
  const diff=Math.round((d-t)/(24*3600*1000));
  if(fRange==="next7")return diff>=0&&diff<=6;
  if(fRange==="last7")return diff>=-6&&diff<=0;
  if(fRange==="last30")return diff>=-29&&diff<=0;
  return true;
}
function daysUntil(dateISO){
  const t=new Date(todayISO()),d=new Date(dateISO);
  return Math.round((d-t)/(24*3600*1000));
}
function isOverdue(t){return t.status!=="done"&&daysUntil(t.date)<0;}
function deadlineInfo(t){
  const d=daysUntil(t.date);
  if(t.status==="done")return{label:"Concluída",color:"#94a3b8",bg:"#f1f5f9",overdue:false};
  if(d<0)return{label:`Atrasada ${Math.abs(d)}d`,color:"#dc2626",bg:"#fee2e2",overdue:true};
  if(d===0)return{label:"Hoje",color:"#ea580c",bg:"#ffedd5",overdue:false};
  if(d===1)return{label:"Amanhã",color:"#d97706",bg:"#fef3c7",overdue:false};
  if(d<=3)return{label:`Em ${d}d`,color:"#d97706",bg:"#fef3c7",overdue:false};
  return{label:`Em ${d}d`,color:"#64748b",bg:"#f1f5f9",overdue:false};
}
function rangeLabel(){
  return{today:"Hoje",next7:"Próximos 7 dias",last7:"Últimos 7 dias",last30:"Últimos 30 dias",all:"Todas as datas",custom:`Data: ${fDate}`}[fRange];
}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// Ad helpers: detect "anúncio" tasks and extract a quantity from the title
const ADS_RE=/(anúncio|anuncio|an[uú]ncios)/i;
function isAdTask(t){return ADS_RE.test(t.title||"");}
function extractAdQty(title){
  // Find a number near the word "anúncio(s)" — e.g. "Subir 5 anúncios", "20 anuncios"
  const s=String(title||"");
  const m=s.match(/(\d+)\s*an[uú]ncio/i)||s.match(/an[uú]ncios?\s*(\d+)/i)||s.match(/\b(\d+)\b/);
  return m?Math.max(0,parseInt(m[1],10)||0):0;
}
// Quantity of ads a task represents: explicit qty field wins, else read from title, else 1 if it's an ad task
function adQtyOf(t){
  if(t&&typeof t.qty==="number"&&t.qty>0)return t.qty;
  if(t&&t.qty!=null&&t.qty!==""){const n=parseInt(t.qty,10);if(n>0)return n;}
  const fromTitle=extractAdQty(t.title);
  return fromTitle>0?fromTitle:1;
}

// Carimba a data de conclusão (doneDate) num patch, conforme a mudança de status.
// - Vira "done": marca a data de HOJE (ou preserva a data original se já estava concluída).
// - Sai de "done" (reaberta): limpa a data.
// Sempre define patch.doneDate para funcionar tanto em updateDoc quanto em setDoc (merge:false).
function setDoneDate(prev,newStatus,patch){
  patch=patch||{};
  if(newStatus==="done"){
    patch.doneDate=(prev&&prev.status==="done"&&prev.doneDate)?prev.doneDate:todayISO();
  }else{
    patch.doneDate=null;
  }
  return patch;
}
// Data de referência da tarefa no relatório: se concluída, usa o dia da conclusão;
// senão, usa o prazo. Assim um anúncio finalizado hoje conta em "hoje", mesmo com prazo diferente.

}

/* ===== Dias úteis (seg–sex) + feriados nacionais — base de todas as métricas /dia ===== */
const _feriadoCache={};
function _easter(y){ // Meeus/Jones/Butcher
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function _ferKey(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function _brHolidays(year){
  if(_feriadoCache[year])return _feriadoCache[year];
  const set=new Set(),add=dt=>set.add(_ferKey(dt));
  // Fixos nacionais: 01/01, 21/04, 01/05, 07/09, 12/10, 02/11, 15/11, 20/11 (Consciência Negra), 25/12
  [[0,1],[3,21],[4,1],[8,7],[9,12],[10,2],[10,15],[10,20],[11,25]].forEach(([m,d])=>add(new Date(year,m,d)));
  // Móveis (baseados na Páscoa): Carnaval seg+ter, Sexta-feira Santa, Corpus Christi
  const pa=_easter(year),mv=off=>{const dt=new Date(pa);dt.setDate(dt.getDate()+off);return dt;};
  [-48,-47,-2,60].forEach(o=>add(mv(o)));
  _feriadoCache[year]=set;return set;
}
function _isFeriado(d){const dt=new Date(d);return _brHolidays(dt.getFullYear()).has(_ferKey(dt));}
// Conta dias úteis no intervalo (inclusivo), pulando fim de semana E feriados nacionais.
function bizDays(from,to){let dias=0,feriados=0;const d=new Date(from);d.setHours(0,0,0,0);const end=new Date(to);end.setHours(0,0,0,0);while(d<=end){const w=d.getDay();if(w>=1&&w<=5){if(_isFeriado(d))feriados++;else dias++;}d.setDate(d.getDate()+1);}return{dias:Math.max(1,dias),feriados};}

    btn.textContent="Criar conta de admin";

      const name=document.getElementById("auth-name").value.trim();
      const email=document.getElementById("auth-email").value.trim().toLowerCase();

      if(!name||!email||pass.length<6){err.textContent="Preencha todos os campos (senha com ao menos 6 caracteres).";err.classList.add("show");return;}
      btn.disabled=true;btn.textContent="Criando conta...";
      try{
        const cred=await window.fb.createUserWithEmailAndPassword(window.fb.auth,email,pass);
        const ini=name.split(" ").slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"?";

          id:cred.user.uid,name,ini,color:"#ea580c",email,role:"admin"
        });

      }catch(e){
        let msg="Erro ao criar conta.";
        if(e.code==="auth/email-already-in-use")msg="Este e-mail já está cadastrado. Use a tela de login.";
        else if(e.code==="auth/invalid-email")msg="E-mail inválido.";
        else if(e.code==="auth/weak-password")msg="Senha muito fraca (mín. 6 caracteres).";
        else msg=e.message||msg;
        err.textContent=msg;err.classList.add("show");
        btn.disabled=false;btn.textContent="Criar conta de admin";
      }
    };
  }else{
    title.textContent="Entrar";
    sub.textContent="Acesse sua conta para continuar.";
    fields.innerHTML=`
      <input class="auth-input" id="auth-email" type="email" placeholder="E-mail" autocomplete="email" autofocus/>
      <input type="password" class="auth-input" id="auth-pass" placeholder="Senha" autocomplete="current-password"/>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:-4px">
        <a href="#" id="auth-forgot" style="font-size:11.5px;color:#ea580c;text-decoration:none;font-weight:600">Esqueci minha senha</a>
        <a href="#" id="auth-switch-setup" style="font-size:11.5px;color:#64748b;text-decoration:none;font-weight:500">Primeiro acesso?</a>
      </div>`;
    btn.textContent="Entrar";
    btn.onclick=async()=>{
      err.classList.remove("show");
      const email=document.getElementById("auth-email").value.trim().toLowerCase();
      const pass=document.getElementById("auth-pass").value;
      if(!email||!pass){err.textContent="Preencha e-mail e senha.";err.classList.add("show");return;}
      btn.disabled=true;btn.textContent="Entrando...";
      try{
        await window.fb.signInWithEmailAndPassword(window.fb.auth,email,pass);
        // onAuthStateChanged handles the rest
      }catch(e){
        let msg="E-mail ou senha incorretos.";
        if(e.code==="auth/invalid-email")msg="E-mail inválido.";
        else if(e.code==="auth/user-disabled")msg="Esta conta foi desativada.";
        else if(e.code==="auth/too-many-requests")msg="Muitas tentativas. Tente novamente em alguns minutos.";
        err.textContent=msg;err.classList.add("show");
        btn.disabled=false;btn.textContent="Entrar";

    };
    setTimeout(()=>{
      const fg=document.getElementById("auth-forgot");
      if(fg)fg.onclick=async ev=>{

  }

  setTimeout(()=>{
    const swLogin=document.getElementById("auth-switch-login");
    if(swLogin)swLogin.onclick=ev=>{ev.preventDefault();showAuthScreen("login");};

// ─── CLEANUP: legacy auto-generated renewal tasks ─────────────────────
// Promoções NÃO criam mais tarefas automaticamente. Esta rotina roda uma
// única vez por sessão (apenas admin) para remover as tarefas de duplicação
// que foram criadas pelo comportamento antigo e limpar referências órfãs.
let _renewCleanupDone=false;
async function cleanupRenewalTasks(){
  if(!isAdmin()||_renewCleanupDone)return;
  _renewCleanupDone=true; // trava síncrona para evitar limpezas concorrentes
  const stale=tsks.filter(t=>t.title&&t.title.indexOf("Duplicar promo:")!==-1);
  const refs=proms.filter(p=>p.taskId);
  if(!stale.length&&!refs.length)return;
  try{
    const batch=window.fb.writeBatch(window.fb.db);

  const tier=plTier(valor);
  const gesPct=plGestaoPct(p.cli),impPct=plImpostoPct(p.cli);
  const taxaShopee=valor*tier.pct/100,imp=valor*impPct/100,ges=valor*gesPct/100;
  const lucro=valor-taxaShopee-imp-tier.fixa-ges-custo;
  const margem=valor>0?lucro/valor*100:0;
  return{valor,custo,sp:tier.pct,tf:tier.fixa,taxaShopee,imp,impPct,ges,gesPct,lucro,margem,tier,priced:valor>0};
}
function plComputeProd(p){
  const meta=prodCfg.meta||15;
  if(!(p.vars&&p.vars.length)){
    const r=plCompute(p);
    return{vars:null,base:r,priced:r.priced,pricedVars:r.priced?1:0,unpricedVars:r.priced?0:1,minM:r.margem,maxM:r.margem,avgM:r.margem,avgL:r.lucro,minV:r.valor,maxV:r.valor,minC:r.custo,maxC:r.custo,minL:r.lucro,maxL:r.lucro,anyBelow:r.priced&&r.margem<meta};
  }
  const rs=p.vars.map(v=>({v,r:plCompute({cli:p.cli,valor:v.valor,custo:v.custo})}));
  const pr=rs.filter(x=>x.r.priced);
  const cs=rs.map(x=>x.r.custo);
  const out={vars:rs,base:null,priced:pr.length>0,pricedVars:pr.length,unpricedVars:rs.length-pr.length,minC:Math.min(...cs),maxC:Math.max(...cs),minM:0,maxM:0,avgM:0,avgL:0,minV:0,maxV:0,minL:0,maxL:0,anyBelow:false};
  if(pr.length){
    const ms=pr.map(x=>x.r.margem),vs=pr.map(x=>x.r.valor),ls=pr.map(x=>x.r.lucro);
    out.minM=Math.min(...ms);out.maxM=Math.max(...ms);out.avgM=ms.reduce((a,b)=>a+b,0)/ms.length;
    out.minV=Math.min(...vs);out.maxV=Math.max(...vs);
    out.minL=Math.min(...ls);out.maxL=Math.max(...ls);out.avgL=ls.reduce((a,b)=>a+b,0)/ls.length;
    out.anyBelow=out.minM<meta;
  }
  return out;
}

function plClose(){const m=document.getElementById("pl-modal");if(m){m.style.display="none";m.innerHTML="";}}
function plHistChart(hist){
  hist=(hist||[]).filter(h=>!h.n&&plNum(h.para)>0);
  if(hist.length<2)return"";
  const H=hist.slice(-12);
  const W=560,Ht=160,padL=18,padR=18,padT=24,padB=26;
  const iw=W-padL-padR,ih=Ht-padT-padB;
  const prices=H.map(h=>plNum(h.para));
  let pmin=Math.min(...prices),pmax=Math.max(...prices);
  if(pmin===pmax){pmin=pmin*0.92;pmax=(pmax*1.08)||1;}
  const span=pmax-pmin;pmin-=span*0.10;pmax+=span*0.14;
  const v7s=H.map(h=>(h.v7!==undefined&&h.v7!=='')?plNum(h.v7):null);
  const vvals=v7s.filter(v=>v!==null);
  const vmax=Math.max(1,...(vvals.length?vvals:[1]));
  const x=i=>padL+(H.length===1?iw/2:i*iw/(H.length-1));
  const y=p=>padT+ih-((p-pmin)/(pmax-pmin))*ih;
  const base=padT+ih,barw=Math.min(24,iw/H.length*0.45);
  let bars="",dots="",plabels="",dlabels="",lastDate="";
  H.forEach((h,i)=>{
    const xi=x(i);
    if(v7s[i]!==null){const hb=Math.max(3,v7s[i]/vmax*(ih*0.5));
      bars+=`<rect x="${(xi-barw/2).toFixed(1)}" y="${(base-hb).toFixed(1)}" width="${barw.toFixed(1)}" height="${hb.toFixed(1)}" rx="3" fill="#F7941E" opacity=".25"/>`;
      bars+=`<text x="${xi.toFixed(1)}" y="${(base-hb-4).toFixed(1)}" font-size="9" text-anchor="middle" fill="#8A6233" font-weight="700">${v7s[i]}</text>`;}
    dots+=`<circle cx="${xi.toFixed(1)}" cy="${y(prices[i]).toFixed(1)}" r="3.6" fill="#fff" stroke="#EE4D2D" stroke-width="2.4"/>`;
    const dd=String(h.d).slice(0,5);
    if(dd!==lastDate){dlabels+=`<text x="${xi.toFixed(1)}" y="${Ht-7}" font-size="9" text-anchor="middle" fill="#9AA1AE" font-weight="600">${esc(dd)}</text>`;lastDate=dd;}
    if(i===0||prices[i]!==prices[i-1]){
      plabels+=`<text x="${xi.toFixed(1)}" y="${(y(prices[i])-9).toFixed(1)}" font-size="10" text-anchor="middle" fill="#C73E22" font-weight="800" paint-order="stroke" stroke="#fff" stroke-width="3.5">${prices[i].toFixed(2).replace('.',',')}</text>`;
    }
  });
  const pts=H.map((h,i)=>x(i).toFixed(1)+','+y(prices[i]).toFixed(1)).join(' ');
  const defs=`<defs><linearGradient id="plgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EE4D2D" stop-opacity=".16"/><stop offset="1" stop-color="#EE4D2D" stop-opacity="0"/></linearGradient></defs>`;
  const axis=`<line x1="${padL}" y1="${base}" x2="${W-padR}" y2="${base}" stroke="#E6E8EE" stroke-width="1.5"/>`;
  const area=`<polygon points="${x(0).toFixed(1)},${base} ${pts} ${x(H.length-1).toFixed(1)},${base}" fill="url(#plgrad)"/>`;
  const line=`<polyline points="${pts}" fill="none" stroke="#EE4D2D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  return `<div class="pl-chart"><div class="pl-chart-t">Preço × vendas 7d</div><svg viewBox="0 0 ${W} ${Ht}" style="width:100%;height:auto;display:block">${defs}${axis}${bars}${area}${line}${dots}${plabels}${dlabels}</svg></div>`;
}
function plToday(){const dt=new Date();return String(dt.getDate()).padStart(2,"0")+"/"+String(dt.getMonth()+1).padStart(2,"0")+"/"+dt.getFullYear();}
function plHistRows(hist){
  if(!hist||!hist.length)return '<div class="pl-hempty">Nenhum registro ainda. Mudanças de preço entram automaticamente ao salvar.</div>';
  return hist.slice().reverse().map(h=>{
    const hasP=h.para!==undefined&&h.para!==''&&plNum(h.para)>0;
    const changed=hasP&&h.de!==undefined&&h.de!==''&&plNum(h.de)!==plNum(h.para);
    const price=hasP?(changed?plMoney(h.de)+' → '+plMoney(h.para):plMoney(h.para)):'';
    const v=(h.v7!==undefined&&h.v7!=='')?`${price?' · ':''}${h.v7} vendas/7d`:'';
    const pre=h.n?esc(h.n)+': ':'';
    return `<div class="pl-hrow"><span>${esc(h.d)}</span><b>${pre}${price}${v}</b></div>`;
  }).join('');
}

  const obj={cli:g('cli'),sku:g('sku'),nome:g('nome'),valor:plNum(g('valor')),custo:plNum(g('custo')),
    peso:g('peso'),medidasPacote:g('medidasPacote'),medidasProduto:g('medidasProduto'),cores:g('cores'),material:g('material'),link:g('link'),fotos:g('fotos'),nota:g('nota')};
  if(!obj.nome&&!obj.sku){

    const el=document.getElementById("pl-f-nome");
    if(el){el.style.borderColor="#E03B3B";el.focus();el.addEventListener("input",()=>{el.style.borderColor="";},{once:true});}
    return;
  }
  obj.vars=plVarsData().map(v=>({nome:v.nome,custo:plNum(v.custo),valor:plNum(v.valor)}));
  if(plEditId){
    const prev=prods.find(x=>x.id===plEditId);
    const hist=(prev&&prev.hist)?prev.hist.slice():[];
    if(obj.vars.length){
      const old={};((prev&&prev.vars)||[]).forEach(v=>{if(v.nome)old[v.nome]=plNum(v.valor);});
      obj.vars.forEach(v=>{const o=old[v.nome];if(v.nome&&o>0&&v.valor>0&&v.valor!==o)hist.push({d:plToday(),de:o,para:v.valor,n:v.nome,v7:''});});
    }else if(prev&&plNum(prev.valor)>0&&plNum(prev.valor)!==obj.valor){
      const v7=g('v7');
      hist.push({d:plToday(),de:plNum(prev.valor),para:obj.valor,v7:v7!==''?plNum(v7):''});

  try{

function rClientes(){
  // Filter stores by selected owner AND by ERP
  let filtered=fCust==="all"?clis.slice():clis.filter(c=>c.custId===fCust);
  if(fErp!=="all")filtered=filtered.filter(c=>erpOfStore(c)===fErp);
  if(fMkt!=="all")filtered=filtered.filter(c=>(c.mkt||"")===fMkt);
  // Sort: owners with more stores first, then keep each owner's stores grouped together,
  // and finally alphabetical by store name within the same owner.
  const storeCountOf=cid=>cid?storesOfCust(cid).length:0;
  filtered.sort((a,b)=>{
    // 1) by store count of the owner (more stores first)
    const d=storeCountOf(b.custId)-storeCountOf(a.custId);
    if(d!==0)return d;
    // 2) group same owner together — order owners by their name
    const an=a.custId&&getCust(a.custId)?getCust(a.custId).name:"zzz";
    const bn=b.custId&&getCust(b.custId)?getCust(b.custId).name:"zzz";
    const o=an.localeCompare(bn);
    if(o!==0)return o;
    // 3) within the same owner, alphabetical by store name
    return a.name.localeCompare(b.name);
  });
  // Customer dropdown options — sorted by store count desc (most stores first)
  const cuOpts=custs.slice().sort((a,b)=>{
    const d=storesOfCust(b.id).length-storesOfCust(a.id).length;
    return d!==0?d:a.name.localeCompare(b.name);
  }).map(cu=>{
    const n=storesOfCust(cu.id).length;
    return`<option value="${cu.id}"${fCust===cu.id?" selected":""}>${esc(cu.name)} (${n})</option>`;

  const rows=filtered.map(c=>{
    const open=tsks.filter(t=>t.cli===c.id&&t.status!=="done").length;
    const _cu=c.custId?getCust(c.custId):null;
    const _lg=(_cu&&_cu.login)||{};
    const _sl=(_lg.stores&&_lg.stores[c.id])||{};
    const hasAcc=(c.access&&(c.access.user||c.access.pass||c.access.url))||_sl.user||_sl.pass||_sl.url||(_lg.erp&&(_lg.erp.user||_lg.erp.pass||_lg.erp.url||_lg.erp.id))||_lg.sheet;
    return`<tr>
      <td>
        <div style="font-weight:600">${esc(c.name)}</div>
        ${ownerBadgeHTML(c)}
      </td>
      <td style="text-align:center">${mktBadge(c.mkt)}</td>
      <td><span style="display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;color:${open>0?"#dc2626":"#16a34a"}"><span style="width:7px;height:7px;border-radius:50%;background:${open>0?"#dc2626":"#16a34a"};display:inline-block"></span>${open}</span></td>
      <td><div style="display:flex;gap:6px;align-items:center">
        <button data-acc="${c.id}" title="Ver acessos da loja" class="acc-btn${hasAcc?" has":""}">🔑 Acesso</button>
        ${isAdmin()?`<button data-ecli="${c.id}" title="Editar" class="icon-btn">✎</button>
        <button data-dcli="${c.id}" title="Excluir" class="icon-btn danger">✕</button>`:''}
      </div></td>
    </tr>`;
  }).join("");

  // Filter bar
  const filterBar=(custs.length>0||usedMkts.length>0)?`<div class="filter-bar" style="margin-bottom:14px">
    <span style="font-size:11px;color:#64748b;font-weight:600">🔍 FILTRAR</span>
    ${custs.length>0?`<select id="cli-cust-filter" data-search data-placeholder="🔍 Buscar cliente..."><option value="all">Todos os clientes (${clis.length} lojas)</option>${cuOpts}</select>`:""}

  </div>`:"";

  return`

      <div style="display:flex;gap:8px">

// ─── RELATÓRIOS ───────────────────────────────────────────────────────
function inRepRange(taskDate){
  if(repRange==="all")return true;
  if(repRange==="custom"){
    if(repFrom&&taskDate<repFrom)return false;
    if(repTo&&taskDate>repTo)return false;
    return true;
  }
  const t=new Date(todayISO()),d=new Date(taskDate);
  const diff=Math.round((d-t)/(24*3600*1000));
  if(repRange==="today")return taskDate===todayISO();
  if(repRange==="last7")return diff>=-6&&diff<=0;
  if(repRange==="last30")return diff>=-29&&diff<=0;
  if(repRange==="last90")return diff>=-89&&diff<=0;
  return true;
}
function repFmtBR(iso){if(!iso)return"";const p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;}
function repSyncDates(range){
  repRange=range;
  const iso=ts=>new Date(ts).toISOString().slice(0,10);
  const today=todayISO();
  if(range==="today"){repFrom=today;repTo=today;}
  else if(range==="last7"){repFrom=iso(Date.now()-6*864e5);repTo=today;}
  else if(range==="last30"){repFrom=iso(Date.now()-29*864e5);repTo=today;}
  else if(range==="last90"){repFrom=iso(Date.now()-89*864e5);repTo=today;}
  else {repFrom="";repTo="";} // "all" — sem intervalo fixo
}
function repRangeLabel(){
  if(repRange==="custom"){
    if(repFrom&&repTo)return repFmtBR(repFrom)+" a "+repFmtBR(repTo);
    if(repFrom)return "A partir de "+repFmtBR(repFrom);
    if(repTo)return "Até "+repFmtBR(repTo);
    return "Período personalizado";
  }
  return{today:"Hoje",last7:"Últimos 7 dias",last30:"Últimos 30 dias",last90:"Últimos 90 dias",all:"Todo o histórico"}[repRange]||"";
}

// ─── PROMOÇÕES ────────────────────────────────────────────────────────
const PROMO_TYPES=["Promoção de Desconto","Leve Mais por Menos"];

function promoUrgency(p){
  if(p.status==="renewed")return{cls:"",lbl:"Renovada",col:"#16a34a",bg:"#dcfce7"};
  if(p.status==="expired")return{cls:"expired",lbl:"Expirada",col:"#64748b",bg:"#f1f5f9"};
  const d=daysUntil(p.end);
  if(d<0)return{cls:"urg-red",lbl:`Vencida ${Math.abs(d)}d`,col:"#dc2626",bg:"#fee2e2"};
  if(d===0)return{cls:"urg-red",lbl:"Hoje!",col:"#dc2626",bg:"#fee2e2"};
  if(d===1)return{cls:"urg-red",lbl:"Amanhã",col:"#dc2626",bg:"#fee2e2"};
  if(d<=3)return{cls:"urg-orange",lbl:`Em ${d}d`,col:"#ea580c",bg:"#ffedd5"};
  if(d<=7)return{cls:"urg-amber",lbl:`Em ${d}d`,col:"#d97706",bg:"#fef3c7"};
  return{cls:"urg-green",lbl:`Em ${d}d`,col:"#16a34a",bg:"#dcfce7"};
}

function rPromos(){
  const vps=visibleProms();
  // Stats
  const active=vps.filter(p=>p.status==="active").length;
  const urgent=vps.filter(p=>p.status==="active"&&daysUntil(p.end)<=2).length;
  const weekly=vps.filter(p=>p.status==="active"&&daysUntil(p.end)>=0&&daysUntil(p.end)<=7).length;
  const expired=vps.filter(p=>p.status==="active"&&daysUntil(p.end)<0).length;
  // Sort by end date asc, active first
  const sorted=[...vps].sort((a,b)=>{
    const sa=a.status==="active"?0:1,sb=b.status==="active"?0:1;
    if(sa!==sb)return sa-sb;
    return a.end.localeCompare(b.end);
  });
  const cards=sorted.length===0
    ?`<div style="background:white;border-radius:12px;padding:40px;text-align:center;color:#94a3b8;font-size:13px">Nenhuma promoção cadastrada.</div>`
    :sorted.map(p=>{
      const e=getEmp(p.emp),c=getCli(p.cli);
      const u=promoUrgency(p);
      const d=daysUntil(p.end);
      const showRenew=p.status==="active"&&d<=7;
      return`<div class="promo-card ${u.cls}">
        <div class="promo-time" style="background:${u.bg};color:${u.col}">
          <div class="promo-time-big">${d<0?Math.abs(d):d}</div>
          <div class="promo-time-lbl">${d<0?"dias atrás":d===0?"HOJE":d===1?"AMANHÃ":"dias"}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="font-size:14px;font-weight:700;color:#0f172a">${esc(p.name)}</span>
            <span class="badge" style="background:${u.bg};color:${u.col}">${u.lbl}</span>
          </div>
          <div style="font-size:12px;color:#64748b;margin-bottom:5px">
            🏪 <strong>${c?esc(c.name):"—"}</strong> · ${esc(p.type)} · expira ${fmtDate(p.end)}
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            ${avHTML(e,18)}
            <span style="font-size:11px;color:#94a3b8">${e?esc(e.name):"—"}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          ${showRenew?`<button class="btn-renew" data-renew="${p.id}">✓ Renovar/Duplicada</button>`:""}
          <div style="display:flex;gap:4px;justify-content:flex-end">
            <button data-eprm="${p.id}" style="background:none;border:none;color:#94a3b8;font-size:14px;padding:2px 5px">✎</button>
            <button data-dprm="${p.id}" style="background:none;border:none;color:#fca5a5;font-size:14px;padding:2px 5px">✕</button>
          </div>
        </div>
      </div>`;
    }).join("");
  return`
    <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:#9a3412;line-height:1.5">
      💡 <strong>Como funciona:</strong> Cadastre cada promoção/ferramenta ativa nas suas lojas Shopee com a data de expiração. Quando faltarem poucos dias para vencer, a promo aparece em <strong>destaque</strong> aqui com o botão de renovar. Clique em <strong>"Renovar/Duplicada"</strong> após renovar para registrar.
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
      <div class="stat-card"><div class="stat-label">Ativas</div><div class="stat-value" style="color:#0f172a">${active}</div></div>
      <div class="stat-card" style="background:${urgent>0?"#fef2f2":"white"};border-color:${urgent>0?"#fecaca":"#e2e8f0"}"><div class="stat-label" style="color:${urgent>0?"#dc2626":"#64748b"}">🔴 Urgentes (≤2d)</div><div class="stat-value" style="color:#dc2626">${urgent}</div></div>
      <div class="stat-card"><div class="stat-label">Esta semana</div><div class="stat-value" style="color:#ea580c">${weekly}</div></div>
      <div class="stat-card"><div class="stat-label">Vencidas</div><div class="stat-value" style="color:#94a3b8">${expired}</div></div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
      <button class="btn-primary" id="new-promo-btn">+ Nova Promoção</button>
    </div>
    ${cards}`;
}

function openPromoForm(promId){
  const p=promId?proms.find(x=>x.id===promId):null;
  const cOpts=clis.map(c=>`<option value="${c.id}"${p&&p.cli===c.id?" selected":""}>${esc(c.name)} (${esc(c.mkt)})</option>`).join("");
  const eOpts=emps.map(e=>`<option value="${e.id}"${p?p.emp===e.id?" selected":"":currentUser&&currentUser.id===e.id?" selected":""}>${esc(e.name)}</option>`).join("");
  const tOpts=PROMO_TYPES.map(t=>`<option${p&&p.type===t?" selected":""}>${esc(t)}</option>`).join("");
  const formHTML=`<div class="form-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:14px;font-weight:700">${p?"Editar promoção":"Nova promoção"}</span>
      <button id="pf-close" style="background:none;border:none;color:#94a3b8;font-size:18px">✕</button>
    </div>
    <input id="pf-name" class="finput" placeholder="Nome da promoção (ex: Cupom 10% OFF)" value="${p?esc(p.name):""}" style="margin-bottom:10px;font-size:14px;font-weight:500"/>
    <div class="form-row" style="grid-template-columns:1fr 1fr 1fr">
      <div class="form-group"><label>Loja</label><select id="pf-cli" class="finput" data-search data-placeholder="🔍 Buscar loja...">${cOpts}</select></div>
      <div class="form-group"><label>Tipo de ferramenta</label><select id="pf-type" class="finput">${tOpts}</select></div>
      <div class="form-group"><label>Responsável</label><select id="pf-emp" class="finput">${eOpts}</select></div>
    </div>
    <div class="form-row" style="grid-template-columns:auto 1fr">
      <div class="form-group"><label>⏰ Data de expiração</label><input type="date" id="pf-end" class="finput" value="${p?p.end:daysAhead(7)}"/></div>
      ${p?`<div class="form-group"><label>Status</label><select id="pf-status" class="finput">
        <option value="active"${p.status==="active"?" selected":""}>Ativa</option>
        <option value="renewed"${p.status==="renewed"?" selected":""}>Renovada</option>
        <option value="expired"${p.status==="expired"?" selected":""}>Expirada</option>
      </select></div>`:""}
    </div>
    <div class="form-actions">
      <button id="pf-cancel" class="btn-sm">Cancelar</button>
      <button id="pf-save" class="btn-primary">${p?"Salvar":"Cadastrar"}</button>
    </div>
  </div>`;
  showFormModal(formHTML);
  document.getElementById("pf-close").onclick=document.getElementById("pf-cancel").onclick=closeFormModal;
  document.getElementById("pf-save").onclick=async()=>{
    const name=document.getElementById("pf-name").value.trim();
    if(!name){showToast("Informe o nome da promoção","error");return;}
    const obj={
      id:promId||uid(),
      name,
      cli:document.getElementById("pf-cli").value,
      type:document.getElementById("pf-type").value,
      emp:document.getElementById("pf-emp").value,
      end:document.getElementById("pf-end").value,
      status:promId?document.getElementById("pf-status").value:"active",
      taskId:p?p.taskId:""
    };
    closeFormModal();
    try{
      const{id,...patch}=obj;
      if(promId){await fbSet("promos",promId,patch);}
      else{await fbAdd("promos",patch);}
      showToast(promId?"Promoção atualizada":"Promoção cadastrada");
    }catch(e){showToast("Erro: "+(e.message||""),"error");}
  };
}

async function renewPromo(id){
  const p=proms.find(x=>x.id===id);
  if(!p)return;
  showRenewModal(p);
}

function showRenewModal(p){
  const cli=getCli(p.cli);
  const presets=[
    {days:7,label:"7 dias"},
    {days:15,label:"15 dias"},
    {days:30,label:"30 dias",default:true},
    {days:60,label:"60 dias"},
    {days:90,label:"90 dias"},
  ];
  const defaultDate=(()=>{const d=new Date();d.setDate(d.getDate()+30);return d.toISOString().slice(0,10);})();
  const formHTML=`<div class="form-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:14px;font-weight:700">🎯 Confirmar duplicação</span>
      <button id="rn-close" style="background:none;border:none;color:#94a3b8;font-size:18px">✕</button>
    </div>
    <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:#9a3412;line-height:1.5">
      <strong>${esc(p.name)}</strong> · ${esc(p.type)}<br/>
      Loja: ${cli?esc(cli.name):"—"} · expira ${fmtDate(p.end)}<br/>
      <span style="font-size:11.5px;color:#c2410c">A promo atual será marcada como renovada e uma nova será criada com a duração que você escolher abaixo.</span>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label style="margin-bottom:8px;display:block">⏱️ Quanto tempo a nova promoção vai durar?</label>
      <div id="rn-presets" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${presets.map(pr=>`<button type="button" class="rn-preset${pr.default?" active":""}" data-days="${pr.days}">${pr.label}</button>`).join("")}
      </div>
    </div>
    <div class="form-group">
      <label>📅 Ou data de expiração específica</label>
      <input type="date" id="rn-date" class="finput" value="${defaultDate}" style="width:auto"/>
    </div>
    <div class="form-actions">
      <button id="rn-cancel" class="btn-sm">Cancelar</button>
      <button id="rn-confirm" class="btn-primary">✓ Confirmar duplicação</button>
    </div>
  </div>`;
  showFormModal(formHTML);
  document.getElementById("rn-close").onclick=document.getElementById("rn-cancel").onclick=closeFormModal;
  // Preset buttons update date
  document.querySelectorAll(".rn-preset").forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll(".rn-preset").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      const days=+btn.dataset.days;
      const d=new Date();d.setDate(d.getDate()+days);
      document.getElementById("rn-date").value=d.toISOString().slice(0,10);
    };
  });
  // Manual date clears preset selection
  document.getElementById("rn-date").onchange=()=>{
    document.querySelectorAll(".rn-preset").forEach(b=>b.classList.remove("active"));
  };
  document.getElementById("rn-confirm").onclick=async()=>{
    const newEnd=document.getElementById("rn-date").value;
    if(!newEnd){showToast("Selecione uma data válida","error");return;}
    closeFormModal();
    try{
      const batch=window.fb.writeBatch(window.fb.db);
      batch.update(window.fb.doc(window.fb.db,"promos",p.id),{status:"renewed"});
      const newRef=window.fb.doc(window.fb.collection(window.fb.db,"promos"));
      batch.set(newRef,{id:newRef.id,cli:p.cli,emp:p.emp,name:p.name,type:p.type,end:newEnd,status:"active",taskId:""});
      if(p.taskId&&tsks.some(t=>t.id===p.taskId)){batch.update(window.fb.doc(window.fb.db,"tasks",p.taskId),{status:"done"});}
      await batch.commit();
      const days=Math.round((new Date(newEnd)-new Date(todayISO()))/(24*3600*1000));
      showToast(`✓ Promo duplicada · nova expira em ${days} dia${days!==1?"s":""}`);
    }catch(e){showToast("Erro: "+(e.message||""),"error");}
  };
}

function showAccessModal(cliId){
  const c=getCli(cliId);if(!c)return;
  const cu=c.custId?getCust(c.custId):null;
  const lg=(cu&&cu.login)||{};
  // Per-store login saved on the customer record
  const storeLogin=(lg.stores&&lg.stores[c.id])||{};
  // Legacy fallback: data saved directly on the store
  const legacy=c.access||{};
  const acc={
    url:storeLogin.url||legacy.url||"",
    user:storeLogin.user||legacy.user||"",
    pass:storeLogin.pass||legacy.pass||"",
    notes:legacy.notes||""
  };
  const erp=lg.erp||{};
  const erpLabel=erp.provider&&ERP_PRESETS[erp.provider]?ERP_PRESETS[erp.provider].label:(erp.provider||"ERP");
  const mask=document.getElementById("confirm-mask");
  const titleEl=document.getElementById("confirm-title");
  const msgEl=document.getElementById("confirm-msg");
  const okBtn=document.getElementById("confirm-ok");
  const cancelBtn=document.getElementById("confirm-cancel");
  titleEl.innerHTML=`🔑 Acessos — ${esc(c.name)}`;
  const ownerLine=cu?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:#64748b">${mktBadge(c.mkt)}<span>·</span><span>👤 ${esc(cu.name)}</span></div>`:`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:#94a3b8">${mktBadge(c.mkt)}<span>·</span><span>sem cliente vinculado</span></div>`;
  const row=(label,val,isPass,isLink)=>{
    if(!val)return`<div class="access-row"><label>${label}</label><div class="val empty">não cadastrado</div></div>`;
    const display=isPass?`<span class="val pw-val" data-pw="${esc(val)}">••••••••</span><button class="pw-toggle">👁</button>`
      :isLink?`<a class="val access-link" href="${esc(val)}" target="_blank" rel="noopener">${esc(val)} ↗</a>`
      :`<span class="val">${esc(val)}</span>`;
    return`<div class="access-row"><label>${label}</label>${display}<button class="copy-btn" data-copy="${esc(val)}">Copiar</button></div>`;
  };
  const hasStore=acc.url||acc.user||acc.pass||acc.notes;
  const hasErp=erp.user||erp.pass||erp.url||erp.id;
  const hasSheet=!!lg.sheet;
  const hasAny=hasStore||hasErp||hasSheet;
  msgEl.innerHTML=`${ownerLine}${hasAny?`
    ${hasStore?`<div style="font-size:10.5px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin:4px 0 6px">🏪 Acesso da loja</div>
    ${row("Link",acc.url,false,true)}
    ${row("Usuário",acc.user,false,false)}
    ${row("Senha",acc.pass,true,false)}
    ${acc.notes?`<div class="access-row" style="align-items:flex-start"><label style="padding-top:4px">Notas</label><div class="val" style="font-family:inherit;white-space:pre-wrap">${esc(acc.notes)}</div><button class="copy-btn" data-copy="${esc(acc.notes)}">Copiar</button></div>`:""}`:""}
    ${hasErp?`<div style="font-size:10.5px;font-weight:700;color:#9a3412;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">🧾 ${esc(erpLabel)}</div>
    ${row("Link",erp.url,false,true)}
    ${row("Usuário",erp.user,false,false)}
    ${row("Senha",erp.pass,true,false)}
    ${erp.id?row("ID / Empresa",erp.id,false,false):""}`:""}
    ${hasSheet?`<div style="font-size:10.5px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px">📊 Planilha</div>${row("Precificação",lg.sheet,false,true)}`:""}
  `:'<div style="text-align:center;color:#94a3b8;font-size:13px;padding:20px 0">Nenhum dado de acesso cadastrado. Cadastre em <strong>Gerenciar clientes → 🔑 (chave do cliente)</strong>.</div>'}`;
  msgEl.style.textAlign="left";
  msgEl.classList.add("access-scroll");
  okBtn.style.display="none";
  cancelBtn.textContent="Fechar";
  cancelBtn.className="btn-sm";
  mask.classList.add("show");
  const close=()=>{
    mask.classList.remove("show");
    okBtn.style.display="";okBtn.className="btn-danger";okBtn.textContent="Confirmar";
    cancelBtn.textContent="Cancelar";
    msgEl.style.textAlign="";
    msgEl.classList.remove("access-scroll");
    cancelBtn.onclick=null;mask.onclick=null;
  };
  cancelBtn.onclick=close;
  mask.onclick=e=>{if(e.target===mask)close();};
  // Bind copy buttons
  msgEl.querySelectorAll(".copy-btn").forEach(btn=>{
    btn.onclick=async()=>{
      try{
        await navigator.clipboard.writeText(btn.dataset.copy);
        const orig=btn.textContent;
        btn.classList.add("copied");btn.textContent="✓ Copiado";
        setTimeout(()=>{btn.classList.remove("copied");btn.textContent=orig;},1500);
      }catch{
        // Fallback for clipboard API failures
        const ta=document.createElement("textarea");ta.value=btn.dataset.copy;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
        const orig=btn.textContent;
        btn.classList.add("copied");btn.textContent="✓ Copiado";
        setTimeout(()=>{btn.classList.remove("copied");btn.textContent=orig;},1500);
      }
    };
  });
  // Password toggles (multiple — store password, ERP password, etc.)
  msgEl.querySelectorAll(".pw-toggle").forEach(pwt=>{
    pwt.onclick=()=>{
      const v=pwt.previousElementSibling;
      if(!v)return;
      const shown=v.textContent!=="••••••••";
      v.textContent=shown?"••••••••":v.dataset.pw;
      pwt.textContent=shown?"👁":"🙈";
    };
  });
}

function deleteCust(id){
  const stores=storesOfCust(id);
  const msg=stores.length>0?`Este cliente possui ${stores.length} loja(s) vinculada(s). Elas ficarão sem cliente após a exclusão. Continuar?`:"Excluir este cliente?";
  askConfirm("Excluir cliente",msg,async()=>{
    try{
      // Batch: unlink stores + delete customer
      const batch=window.fb.writeBatch(window.fb.db);
      stores.forEach(s=>{batch.update(window.fb.doc(window.fb.db,"clients",s.id),{custId:""});});
      batch.delete(window.fb.doc(window.fb.db,"customers",id));
      await batch.commit();
      showToast("Cliente excluído");
    }catch(e){showToast("Erro: "+(e.message||""),"error");}
  });
}

// ─── CSV EXPORT ───────────────────────────────────────────────────────
function exportCSV(){
  const head=["ID","Título","Descrição","Funcionário","Cliente","Marketplace","Status","Prioridade","Prazo","Atrasada","Qtd Anúncios"];
  const escCSV=v=>{const s=String(v==null?"":v);return /[,;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;};
  const rows=tsks.map(t=>{
    const e=getEmp(t.emp),c=getCliV(t);
    return[t.id,t.title,t.desc||"",e?e.name:"",c?c.name:"",c?c.mkt:"",SLBL[t.status],PLBL[t.pri],fmtDate(t.date),isOverdue(t)?"Sim":"Não",isAdTask(t)?adQtyOf(t):""].map(escCSV).join(";");
  });
  const csv="\uFEFF"+[head.join(";"),...rows].join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`OTDE-tarefas-${todayISO()}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function makePieSVG(data){
  const tot=data.reduce((s,d)=>s+d.v,0);
  if(!tot)return`<div style="height:100px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px">Sem dados</div>`;
  const cx=80,cy=65,r=45,ri=25;let ang=-Math.PI/2;
  const paths=data.map(d=>{
    const sw=d.v/tot*Math.PI*2;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    ang+=sw;
    const x2=cx+r*Math.cos(ang),y2=cy+r*Math.sin(ang);
    const xi1=cx+ri*Math.cos(ang-sw),yi1=cy+ri*Math.sin(ang-sw);
    const xi2=cx+ri*Math.cos(ang),yi2=cy+ri*Math.sin(ang);
    const lg=sw>Math.PI?1:0;
    return`<path d="M${x1},${y1} A${r},${r} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${ri},${ri} 0 ${lg},0 ${xi1},${yi1}Z" fill="${d.col}" stroke="white" stroke-width="2"/>`;
  }).join("");
  return`<svg width="160" height="130" viewBox="0 0 160 130">${paths}</svg>`;
}

function openTaskForm(taskId){

  const empList=isAdmin()?emps:emps.filter(e=>currentUser&&e.id===currentUser.id);

  const tplHTML=!t?`<div class="templates">
    <div class="tpl-label">⚡ Modelos rápidos · clique para preencher</div>
    ${TPL.map((tp,i)=>`<button class="tpl-btn" data-tpl="${i}">${esc(tp.title)}</button>`).join("")}
  </div>`:"";
  const formHTML=`<div class="form-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:14px;font-weight:700">${t?"Editar tarefa":"Nova tarefa"}</span>
      <button id="tf-close" style="background:none;border:none;color:#94a3b8;font-size:18px">✕</button>
    </div>
    ${tplHTML}
    <input id="tf-title" class="finput" placeholder="Título da tarefa *" value="${t?esc(t.title):""}" style="margin-bottom:10px;font-size:14px;font-weight:500"/>
    <textarea id="tf-desc" class="finput" rows="2" placeholder="Descrição (opcional)" style="margin-bottom:10px;resize:vertical">${t?esc(t.desc||""):""}</textarea>
    <div class="form-row">
      <div class="form-group"><label>Funcionário</label><select id="tf-emp" class="finput">${eOpts}</select></div>
      <div class="form-group"><label>Cliente</label><select id="tf-cli" class="finput" data-search data-placeholder="🔍 Buscar loja...">${cOpts}</select></div>
      <div class="form-group"><label>Status</label><select id="tf-status" class="finput">
        <option value="todo"${!t||t.status==="todo"?" selected":""}>A fazer</option>
        <option value="doing"${t&&t.status==="doing"?" selected":""}>Em andamento</option>
        <option value="done"${t&&t.status==="done"?" selected":""}>Concluído</option>
      </select></div>
      <div class="form-group"><label>Prioridade</label><select id="tf-pri" class="finput">
        <option value="alta"${t&&t.pri==="alta"?" selected":""}>Alta</option>
        <option value="media"${!t||t.pri==="media"?" selected":""}>Média</option>
        <option value="baixa"${t&&t.pri==="baixa"?" selected":""}>Baixa</option>
      </select></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="form-group" style="margin-bottom:0"><label>⏰ Prazo</label><input type="date" id="tf-date" class="finput" value="${t?t.date:todayISO()}" style="width:auto"/></div>
      <div class="form-group" style="margin-bottom:0"><label>📢 Qtd. de anúncios <span style="color:#94a3b8;font-weight:400;text-transform:none;letter-spacing:0">(0 = não é anúncio)</span></label><input type="number" min="0" id="tf-qty" class="finput" value="${t&&t.qty!=null&&t.qty!==''?esc(String(t.qty)):''}" placeholder="0" style="width:120px"/></div>
    </div>
    <div class="form-actions">
      <button id="tf-cancel" class="btn-sm">Cancelar</button>
      <button id="tf-save" class="btn-primary">${t?"Salvar alterações":"Criar tarefa"}</button>
    </div>
  </div>`;
  showFormModal(formHTML);
  document.getElementById("tf-close").onclick=document.getElementById("tf-cancel").onclick=closeFormModal;
  // Auto-detect ad quantity from the title (only fills when qty field is empty, so manual edits are never overwritten)
  const titleEl=document.getElementById("tf-title");
  const qtyEl=document.getElementById("tf-qty");
  let qtyTouched=!!(t&&t.qty!=null&&t.qty!=="");
  if(qtyEl)qtyEl.addEventListener("input",()=>{qtyTouched=true;});
  function maybeAutofillQty(){
    if(qtyTouched||!qtyEl||!titleEl)return;
    if(!ADS_RE.test(titleEl.value))return;
    const n=extractAdQty(titleEl.value);
    if(n>0)qtyEl.value=String(n);
  }
  if(titleEl)titleEl.addEventListener("input",maybeAutofillQty);
  // Template clicks
  document.querySelectorAll("#form-modal-content [data-tpl]").forEach(btn=>{
    btn.onclick=()=>{
      const tp=TPL[+btn.dataset.tpl];
      document.getElementById("tf-title").value=tp.title;
      document.getElementById("tf-desc").value=tp.desc||"";
      document.getElementById("tf-pri").value=tp.pri;
      maybeAutofillQty();
    };
  });
  document.getElementById("tf-save").onclick=async()=>{
    const title=document.getElementById("tf-title").value.trim();
    if(!title){showToast("Informe o título da tarefa","error");return;}
    const qtyRaw=document.getElementById("tf-qty").value;
    const qty=qtyRaw===""?null:Math.max(0,parseInt(qtyRaw,10)||0);
    const obj={id:taskId||uid(),title,desc:document.getElementById("tf-desc").value.trim(),emp:document.getElementById("tf-emp").value,cli:document.getElementById("tf-cli").value,status:document.getElementById("tf-status").value,pri:document.getElementById("tf-pri").value,date:document.getElementById("tf-date").value,qty:qty};
    closeFormModal();
    try{
      if(taskId){
        const{id,...patch}=obj;
        const _prev=tsks.find(t=>t.id===taskId);
        setDoneDate(_prev,patch.status,patch);
        await fbSet("tasks",taskId,patch);
      }else{
        const _add={title:obj.title,desc:obj.desc,emp:obj.emp,cli:obj.cli,status:obj.status,pri:obj.pri,date:obj.date,qty:obj.qty};
        setDoneDate(null,obj.status,_add);
        await fbAdd("tasks",_add);
      }
      showToast(taskId?"Tarefa atualizada":"Tarefa criada");
    }catch(e){showToast("Erro: "+(e.message||"falha ao salvar"),"error");}
  };
}

    if(e){
      // Edit existing — only update name, color, role, ini
      try{
        await fbUpdate("employees",e.id,{name,ini,color:selColor,role});
        closeFormModal();
        showToast("Funcionário atualizado");

    }else{
      // Create new employee with Firebase Auth + Firestore
      const email=document.getElementById("ef-email").value.trim().toLowerCase();

      if(!email){showToast("Informe o e-mail","error");return;}
      if(pass.length<6){showToast("Senha deve ter ao menos 6 caracteres","error");return;}
