      try{
        // Note: creating a new user via createUserWithEmailAndPassword in Firebase
        // signs them in automatically, which logs out current admin.
        // We use a workaround: keep admin session via re-authentication after.
        const adminEmail=currentUser.email;
        // Prompt admin for their password to re-authenticate after creating new user
        closeFormModal();
        askInput({
          title:"Confirme sua senha",
          message:`Por segurança, digite sua senha (${adminEmail}) para criar o novo funcionário. Você será reconectado automaticamente.`,
          placeholder:"Sua senha de admin",
          type:"password",
          okLabel:"Criar funcionário",
          icon:"🔒",
          validate:(v)=>!v?"Digite sua senha":null,

            try{
              // Step 1: create the new user (this signs us in as them)
              const cred=await window.fb.createUserWithEmailAndPassword(window.fb.auth,email,pass);
              // Step 2: create their employee doc
              await window.fb.setDoc(window.fb.doc(window.fb.db,"employees",cred.user.uid),{
                id:cred.user.uid,name,ini,color:selColor,email,role
              });
              // Step 3: sign out the new user
              await window.fb.signOut(window.fb.auth);
              // Step 4: sign back in as admin
              await window.fb.signInWithEmailAndPassword(window.fb.auth,adminEmail,adminPass);
              showToast(`✓ ${name} cadastrado · repasse o login: ${email}`);
            }catch(err){
              let msg="Erro: "+(err.message||"falha ao criar");
              if(err.code==="auth/email-already-in-use")msg="Este e-mail já está em uso.";
              else if(err.code==="auth/wrong-password"||err.code==="auth/invalid-credential")msg="Senha de admin incorreta. Faça login novamente.";
              showToast(msg,"error");
            }
          }
        });
      }catch(err){
        showToast("Erro: "+(err.message||""),"error");
        saveBtn.disabled=false;saveBtn.textContent="Adicionar";
      }
    }
  };
}

// ─── FORM MODAL ───────────────────────────────────────────────────────
function showFormModal(html){
  const mask=document.getElementById("form-modal-mask");
  const box=document.getElementById("form-modal-content");
  box.innerHTML=html;
  enhanceSearchSelects(box);
  mask.classList.add("show");
  document.body.style.overflow="hidden";
  // Bind backdrop click to close
  mask.onclick=e=>{if(e.target===mask)closeFormModal();};
  // Auto-focus first input
  setTimeout(()=>{
    const inp=box.querySelector("input:not([type=hidden]),textarea,select");
    if(inp){inp.focus();if(inp.select)inp.select();}
  },120);
}
function closeFormModal(){
  const mask=document.getElementById("form-modal-mask");
  mask.classList.remove("show");
  document.getElementById("form-modal-content").innerHTML="";
  document.body.style.overflow="";
  mask.onclick=null;
}


// ─── SEARCHABLE SELECT — combobox with type-to-filter ──────────────────
function enhanceSearchSelects(container){
  container = container || document;
  container.querySelectorAll("select[data-search]:not([data-ss-done])").forEach(sel=>{
    sel.setAttribute("data-ss-done","1");
    const opts = Array.from(sel.options).map(o=>({value:o.value,text:o.textContent}));
    const findOpt = v => opts.find(o=>o.value===v);
    const placeholder = sel.dataset.placeholder || "Buscar...";

    const wrap = document.createElement("div");
    wrap.className = "ss-wrap";
    // Inherit flex/width sizing from the original select so adjacent buttons stay inline
    if(sel.style.flex){ wrap.style.flex = sel.style.flex; wrap.style.width = "auto"; }
    wrap.innerHTML =
      `<input class="ss-input finput" placeholder="${esc(placeholder)}" readonly autocomplete="off"/>`+
      `<span class="ss-chev">▾</span>`+
      `<div class="ss-list" hidden></div>`;

    sel.style.display = "none";
    sel.parentNode.insertBefore(wrap, sel.nextSibling);
    wrap._sel = sel; // referência usada pelo fechamento global (clique fora)

    const input = wrap.querySelector(".ss-input");
    const list  = wrap.querySelector(".ss-list");

    function renderList(query){
      const q = (query||"").toLowerCase().trim();
      const filtered = q
        ? opts.filter(o => o.text.toLowerCase().includes(q))
        : opts.slice();
      if(filtered.length === 0){
        list.innerHTML = `<div class="ss-empty">Nenhum resultado</div>`;
        return;
      }
      list.innerHTML = filtered.map(o =>
        `<div class="ss-opt${o.value===sel.value?" is-selected":""}" data-value="${esc(o.value)}">${esc(o.text)}</div>`
      ).join("");
    }

    function syncInputFromSelect(){
      const cur = findOpt(sel.value) || opts[0];
      input.value = cur ? cur.text : "";
    }

    function open(){
      input.removeAttribute("readonly");
      input.value = "";
      renderList("");
      list.hidden = false;
      wrap.classList.add("is-open");
      setTimeout(()=>input.focus(),0);
    }
    function close(){
      input.setAttribute("readonly","readonly");
      syncInputFromSelect();
      list.hidden = true;
      wrap.classList.remove("is-open");
    }
    function pick(value){
      sel.value = value;
      sel.dispatchEvent(new Event("change",{bubbles:true}));
      close();
    }

    input.addEventListener("mousedown", e=>{
      if(list.hidden){ e.preventDefault(); open(); }
    });
    input.addEventListener("focus", ()=>{ if(list.hidden) open(); });
    input.addEventListener("input", e => renderList(e.target.value));
    input.addEventListener("keydown", e=>{
      if(e.key === "Escape"){ close(); }
      else if(e.key === "Enter"){
        const active = list.querySelector(".ss-opt.is-active") || list.querySelector(".ss-opt");
        if(active) pick(active.dataset.value);
        e.preventDefault();
      }
      else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
        const items = Array.from(list.querySelectorAll(".ss-opt"));
        if(items.length === 0) return;
        let idx = items.findIndex(el => el.classList.contains("is-active"));
        items.forEach(el => el.classList.remove("is-active"));
        idx = e.key === "ArrowDown" ? (idx+1) % items.length : (idx<=0 ? items.length-1 : idx-1);
        items[idx].classList.add("is-active");
        items[idx].scrollIntoView({block:"nearest"});
        e.preventDefault();
      }
    });
    list.addEventListener("mousedown", e=>{
      const opt = e.target.closest(".ss-opt");
      if(opt){ e.preventDefault(); pick(opt.dataset.value); }
    });

    // Fechamento por clique fora é tratado por UM listener global (ssBindGlobalClose),
    // vinculado uma única vez — antes, um listener era adicionado por select a cada
    // render(), acumulando indefinidamente.
    syncInputFromSelect();
  });
  ssBindGlobalClose();
}

// Fecha qualquer searchable-select aberto ao clicar fora dele. Vinculado uma só vez.
function ssBindGlobalClose(){
  if(window._ssGlobalBound)return;
  window._ssGlobalBound=true;
  document.addEventListener("mousedown", e=>{
    document.querySelectorAll(".ss-wrap.is-open").forEach(wrap=>{
      if(wrap.contains(e.target))return;
      const sel=wrap._sel, input=wrap.querySelector(".ss-input"), list=wrap.querySelector(".ss-list");
      if(sel&&input){const o=Array.from(sel.options).find(o=>o.value===sel.value);input.value=o?o.textContent:"";}
      if(input)input.setAttribute("readonly","readonly");
      if(list)list.hidden=true;
      wrap.classList.remove("is-open");
    });
  });
}

// ─── TOASTS ───────────────────────────────────────────────────────────
function showToast(message,type){
  type=type||"success";
  const c=document.getElementById("toast-container");
  const t=document.createElement("div");
  t.className="toast toast-"+type;
  const icon=type==="success"?"✓":type==="error"?"✕":"i";
  t.innerHTML=`<span class="toast-icon-wrap">${icon}</span><span>${esc(message)}</span>`;
  c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),350);},3200);
}

// ─── CUSTOM INPUT MODAL ───────────────────────────────────────────────
function askInput(opts){
  // opts: {title, message, placeholder, defaultValue, okLabel, icon, validate, onOk}
  const mask=document.getElementById("input-mask");
  document.getElementById("input-icon").textContent=opts.icon||"✎";
  document.getElementById("input-title").textContent=opts.title||"Editar";
  document.getElementById("input-msg").textContent=opts.message||"";
  const inp=document.getElementById("input-field");
  inp.value=opts.defaultValue||"";
  inp.placeholder=opts.placeholder||"";
  inp.type=opts.type||"text";
  const okBtn=document.getElementById("input-ok");
  const cancelBtn=document.getElementById("input-cancel");
  const err=document.getElementById("input-err");
  err.classList.remove("show");
  okBtn.textContent=opts.okLabel||"Confirmar";
  mask.classList.add("show");
  setTimeout(()=>{inp.focus();inp.select();},80);
  const close=()=>{
    mask.classList.remove("show");
    okBtn.onclick=null;cancelBtn.onclick=null;mask.onclick=null;inp.onkeydown=null;
    err.classList.remove("show");
  };
  const submit=()=>{
    const v=inp.value.trim();
    if(opts.validate){
      const e=opts.validate(v);
      if(e){err.textContent=e;err.classList.add("show");inp.focus();return;}
    }else if(!v){
      err.textContent="Campo obrigatório.";err.classList.add("show");inp.focus();return;
    }
    close();opts.onOk(v);
  };
  okBtn.onclick=submit;
  cancelBtn.onclick=close;
  mask.onclick=e=>{if(e.target===mask)close();};
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit();}else if(e.key==="Escape"){close();}};
}

// ─── CUSTOM CONFIRM ───────────────────────────────────────────────────
function askConfirm(title,msg,onYes){
  const mask=document.getElementById("confirm-mask");
  document.getElementById("confirm-title").textContent=title;
  const msgEl=document.getElementById("confirm-msg");
  msgEl.textContent=msg;
  // Reset any leftover state from the access modal (which hides OK and changes labels)
  msgEl.classList.remove("access-scroll");
  msgEl.style.textAlign="";
  const ok=document.getElementById("confirm-ok");
  const cancel=document.getElementById("confirm-cancel");
  ok.style.display="";
  ok.className="btn-danger";
  ok.textContent="Confirmar";
  cancel.className="btn-sm";
  cancel.textContent="Cancelar";
  mask.classList.add("show");
  const close=()=>{mask.classList.remove("show");ok.onclick=null;cancel.onclick=null;mask.onclick=null;};
  ok.onclick=()=>{close();onYes();};
  cancel.onclick=close;
  mask.onclick=e=>{if(e.target===mask)close();};
}

// ─── EVENT BINDING ────────────────────────────────────────────────────
// ─── KANBAN DRAG & DROP ───────────────────────────────────────────────
let dragId=null;
function setupKanbanDnD(C){
  const cols=C.querySelectorAll(".kanban-col");
  if(cols.length===0)return;

  C.querySelectorAll(".task-card[draggable=true]").forEach(card=>{
    card.addEventListener("dragstart",e=>{
      dragId=card.dataset.card;
      card.classList.add("dragging");
      e.dataTransfer.effectAllowed="move";
      try{e.dataTransfer.setData("text/plain",dragId);}catch(_){}
    });
    card.addEventListener("dragend",()=>{
      card.classList.remove("dragging");
      C.querySelectorAll(".kanban-col.drag-over").forEach(c=>c.classList.remove("drag-over"));
      dragId=null;
    });
  });

  // Returns the card element we should insert before, based on cursor Y
  function cardAfter(col,y){
    const els=[...col.querySelectorAll(".task-card:not(.dragging)")];
    let closest=null,closestOffset=-Infinity;
    els.forEach(el=>{
      const box=el.getBoundingClientRect();
      const offset=y-box.top-box.height/2;
      if(offset<0&&offset>closestOffset){closestOffset=offset;closest=el;}
    });
    return closest;
  }

  cols.forEach(col=>{
    col.addEventListener("dragover",e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect="move";
      col.classList.add("drag-over");
      const dragging=C.querySelector(".task-card.dragging");
      if(!dragging)return;
      const after=cardAfter(col,e.clientY);
      if(after==null)col.appendChild(dragging);
      else col.insertBefore(dragging,after);
    });
    col.addEventListener("dragleave",e=>{
      // Only remove highlight when truly leaving the column
      if(!col.contains(e.relatedTarget))col.classList.remove("drag-over");
    });
    col.addEventListener("drop",async e=>{
      e.preventDefault();
      col.classList.remove("drag-over");
      const id=dragId;if(!id)return;
      const newStatus=col.dataset.col;
      // Compute new ordered list of card ids in this column (DOM order)
      const orderedIds=[...col.querySelectorAll(".task-card[data-card]")].map(el=>el.dataset.card);
      // Switch to manual order so the new sequence sticks visually
      if(fSort!=="ordem")fSort="ordem";
      try{
        const batch=window.fb.writeBatch(window.fb.db);
        const movedTask=tsks.find(t=>t.id===id);
        const statusChanged=movedTask&&movedTask.status!==newStatus;
        // Renumber every card in this column 0,1,2... and set status of the moved one
        orderedIds.forEach((cid,i)=>{
          const ref=window.fb.doc(window.fb.db,"tasks",cid);
          const patch={order:i};
          if(cid===id&&statusChanged){patch.status=newStatus;setDoneDate(movedTask,newStatus,patch);}
          batch.update(ref,patch);
        });
        await batch.commit();
        if(statusChanged)showToast("Tarefa movida para "+SLBL[newStatus]);
      }catch(err){
        showToast("Erro ao reordenar: "+(err.message||""),"error");
        render();
      }
    });
  });
}

function bindAll(){
  const C=document.getElementById("content");
  // Report range pills
  C.querySelectorAll("[data-reprange]").forEach(btn=>{
    btn.onclick=()=>{repSyncDates(btn.dataset.reprange);render();};
  });
  const repFromEl=C.querySelector("#rep-from"),repToEl=C.querySelector("#rep-to");
  if(repFromEl)repFromEl.onchange=()=>{repFrom=repFromEl.value;repRange="custom";render();};
  if(repToEl)repToEl.onchange=()=>{repTo=repToEl.value;repRange="custom";render();};
  // Range pills (delegated)
  C.querySelectorAll("[data-range]").forEach(btn=>{
    btn.onclick=()=>{
      fRange=btn.dataset.range;
      if(fRange==="custom"){const inp=document.getElementById("range-date");if(inp)fDate=inp.value;}
      render();
    };
  });
  const rd=C.querySelector("#range-date");
  if(rd)rd.onchange=e=>{fDate=e.target.value;fRange="custom";render();};
  // Kanban filters
  const ke=C.querySelector("#k-emp");if(ke)ke.onchange=e=>{fEmp=e.target.value;render();};
  const kc=C.querySelector("#k-cli");if(kc)kc.onchange=e=>{fCli=e.target.value;render();};
  const kcu=C.querySelector("#k-cust");if(kcu)kcu.onchange=e=>{fCust=e.target.value;render();};
  const ks=C.querySelector("#k-sort");if(ks)ks.onchange=e=>{fSort=e.target.value;render();};
  const kcl=C.querySelector("#k-clear");if(kcl)kcl.onclick=()=>{fEmp="all";fCli="all";fCust="all";myOnly=false;render();};
  // New buttons
  const nc=C.querySelector("#new-cli-btn");if(nc)nc.onclick=()=>openClientForm(null);
  const ne=C.querySelector("#new-emp-btn");if(ne)ne.onclick=()=>openEmployeeForm();
  // CSV export
  const exp=C.querySelector("#export-csv");if(exp)exp.onclick=exportCSV;
  // Promo form
  const np=C.querySelector("#new-promo-btn");if(np)np.onclick=()=>openPromoForm(null);
  // Customer panel
  const mc=C.querySelector("#manage-custs-btn");if(mc)mc.onclick=showCustomersPanel;
  const cf=C.querySelector("#cli-cust-filter");if(cf)cf.onchange=e=>{fCust=e.target.value;render();};
  const cef=C.querySelector("#cli-erp-filter");if(cef)cef.onchange=e=>{fErp=e.target.value;render();};
  const cmf=C.querySelector("#cli-mkt-filter");if(cmf)cmf.onchange=e=>{fMkt=e.target.value;render();};
  const ccf=C.querySelector("#cli-clear-filter");if(ccf)ccf.onclick=()=>{fCust="all";fErp="all";fMkt="all";render();};
  // My-only toggle
  const my=C.querySelector("#k-myonly");if(my)my.onclick=()=>{myOnly=!myOnly;render();};
  // Drag & drop reordering / status change
  setupKanbanDnD(C);
  // Task actions via delegation — vincula UMA única vez.
  // O #content persiste entre renders (só o innerHTML muda), então adicionar o
  // listener a cada render() empilhava handlers duplicados. O guard resolve.
  if(!C._clickBound){C._clickBound=true;
  C.addEventListener("click",ev=>{
    const vw=ev.target.closest("[data-view]");if(vw){openTaskView(vw.dataset.view);return;}
    const ed=ev.target.closest("[data-edit]");if(ed){openTaskForm(ed.dataset.edit);return;}
    const dl=ev.target.closest("[data-del]");if(dl){askConfirm("Excluir tarefa","Tem certeza que deseja excluir esta tarefa? Esta ação não pode ser desfeita.",async()=>{try{await fbDelete("tasks",dl.dataset.del);showToast("Tarefa excluída");}catch(e){showToast("Erro: "+(e.message||""),"error");}});return;}
    const mv=ev.target.closest("[data-move]");if(mv){const _tk=tsks.find(t=>t.id===mv.dataset.move);const _patch=setDoneDate(_tk,mv.dataset.next,{status:mv.dataset.next});fbUpdate("tasks",mv.dataset.move,_patch).catch(e=>showToast("Erro: "+(e.message||""),"error"));return;}
    const ec=ev.target.closest("[data-ecli]");if(ec){openClientForm(ec.dataset.ecli);return;}
    const dc=ev.target.closest("[data-dcli]");if(dc){askConfirm("Excluir loja","Tem certeza que deseja excluir esta loja? Esta ação não pode ser desfeita.",async()=>{try{await fbDelete("clients",dc.dataset.dcli);showToast("Loja excluída");}catch(e){showToast("Erro: "+(e.message||""),"error");}});return;}
    const de=ev.target.closest("[data-demp]");if(de){
      if(currentUser&&currentUser.id===de.dataset.demp){showToast("Você não pode remover sua própria conta","error");return;}
      askConfirm("Remover funcionário","O funcionário não conseguirá mais acessar o sistema. Continuar?",async()=>{
        try{await fbDelete("employees",de.dataset.demp);showToast("Funcionário removido");}
        catch(err){showToast("Erro: "+(err.message||""),"error");}
      });return;
    }
    const eemp=ev.target.closest("[data-eemp]");if(eemp){openEmployeeForm(eemp.dataset.eemp);return;}
    // Promo actions
    const eprm=ev.target.closest("[data-eprm]");if(eprm){openPromoForm(eprm.dataset.eprm);return;}
    const dprm=ev.target.closest("[data-dprm]");if(dprm){askConfirm("Excluir promoção","Tem certeza que deseja excluir esta promoção?",async()=>{try{await fbDelete("promos",dprm.dataset.dprm);showToast("Promoção excluída");}catch(e){showToast("Erro: "+(e.message||""),"error");}});return;}
    const ren=ev.target.closest("[data-renew]");if(ren){renewPromo(ren.dataset.renew);return;}
    // Access modal
    const ac=ev.target.closest("[data-acc]");if(ac){showAccessModal(ac.dataset.acc);return;}
    // Customer actions
    const ecu=ev.target.closest("[data-ecust]");if(ecu){renameCust(ecu.dataset.ecust);return;}
    const dcu=ev.target.closest("[data-dcust]");if(dcu){deleteCust(dcu.dataset.dcust);return;}
    if(ev.target.closest("#add-cust-btn")){quickAddCust();return;}
    if(ev.target.closest("#close-cust-panel")){closeFormModal();return;}
  });
  }
}

// ─── BOOT ─────────────────────────────────────────────────────────────
async function checkSetupNeeded(){
  // Check if any admin exists in Firestore
  try{
    const snap=await window.fb.getDocs(window.fb.collection(window.fb.db,"employees"));
    return snap.empty;
  }catch(e){
    console.error("Setup check failed:",e);
    return false;
  }
}

async function boot(){
  // Wait for Firebase SDK to be loaded
  if(!window.fbReady){
    await new Promise(resolve=>{
      window.addEventListener("fb-ready",resolve,{once:true});
      setTimeout(resolve,5000);
    });
  }
  if(!window.fb){
    document.getElementById("loading-text").textContent="Erro ao carregar Firebase. Verifique sua conexão e atualize a página.";
    return;
  }

  // Listen for auth state changes
  window.fb.onAuthStateChanged(window.fb.auth,async(user)=>{
    if(user){
      // User is signed in — load their employee record
      setSyncStatus("loading","Carregando...");
      try{
        const empDoc=await window.fb.getDoc(window.fb.doc(window.fb.db,"employees",user.uid));
        if(!empDoc.exists()){
          // No matching employee — sign out and show error
          await window.fb.signOut(window.fb.auth);
          document.getElementById("loading-overlay").style.display="none";
          showAuthScreen("login");
          showToast("Sua conta não está vinculada a um funcionário. Contate o admin.","error");
          return;
        }
        currentUser=empDoc.data();
        hideAuthScreen();
        document.getElementById("loading-overlay").style.display="none";
        updateUserChip();
        startListeners();
      }catch(e){
        console.error("Boot error:",e);
        showToast("Erro ao carregar dados: "+(e.message||""),"error");
      }
    }else{
      // User is signed out
      stopListeners();
      currentUser=null;
      emps=[];clis=[];tsks=[];proms=[];custs=[];prods=[];
      myOnly=false;
      updateUserChip();
      document.getElementById("loading-overlay").style.display="none";
      setSyncStatus("offline","Desconectado");
      const setupNeeded=await checkSetupNeeded();
      showAuthScreen(setupNeeded?"setup":"login");
    }
  });
}

document.getElementById("logout-btn").onclick=()=>askConfirm("Sair do sistema","Deseja realmente sair?",logout);

  const btn=e.target.closest(".nav-btn");
  if(!btn||!currentUser)return;
  view=btn.dataset.view;
  render();
});

boot();
